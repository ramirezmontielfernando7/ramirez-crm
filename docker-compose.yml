# ============================================================
# Vocero CRM — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:        cp .env.example .env  →  rellenar  →  docker compose up -d --build
# Actualizar: git pull  →  docker compose up -d --build
#
# La app se CONSTRUYE desde este código (build: .): no hay imagen publicada
# de este fork, y la del upstream (ghcr.io/kevinrivm/vocero-crm) no trae los
# cambios de este repo ni sus migraciones. La primera vez y en cada
# actualización, construye:
#
#   docker compose build --build-arg SOURCE_COMMIT=$(git rev-parse HEAD)
#   docker compose up -d
#
# (o en un paso: docker compose up -d --build). SOURCE_COMMIT es opcional:
# solo sirve para que la app diga de qué commit salió. La imagen queda en tu
# máquina como `ramirez-crm:local`; construir en el propio VPS funciona igual
# en amd64 y en ARM.
# ============================================================
services:
  app:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    # Nombre local de lo que se construye; `pull_policy: build` evita que
    # Compose intente descargarlo de un registro.
    image: ramirez-crm:local
    pull_policy: build
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      # Opcionales: vacías = apagadas (guía de cada una en .env.example).
      CHANNELS: ${CHANNELS:-}
      AGENDA: ${AGENDA:-}
      ATRIBUCION: ${ATRIBUCION:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BRAIN_HEALTH_URL: ${BRAIN_HEALTH_URL:-}
    volumes:
      # Adjuntos, logo e icono (la imagen ya trae MEDIA_DIR=/data/media): sin
      # este volumen se pierden al recrear el contenedor.
      - vocero_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vocero_caddy_data:/data
      - vocero_caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vocero_pg:
  vocero_app_data:
  vocero_caddy_data:
  vocero_caddy_config:
