/* ---- src/app.js ---- */
/* Motor del prototipo: navegación, capas (hojas/modales/menús), temas, revisión. Todo simulado. */
const TABROOT={inbox:'INB-01',crm:'CRM-01',lab:'LAB-01',mkt:'MKT-01',more:'MORE-01'};
const TABS={
  inbox:{l:'Bandeja',i:'inbox'},crm:{l:'CRM',i:'kanban'},lab:{l:'Estudio IA',i:'flask-conical'},mkt:{l:'Marketing',i:'megaphone'},more:{l:'Más',i:'ellipsis'}
};
const ROLE_TABS={owner:['inbox','crm','lab','mkt','more'],coord:['inbox','crm','mkt','more'],asesor:['inbox','crm','more']};
const ROLE_LABEL={owner:'Propietario',coord:'Coordinador',asesor:'Asesor'};
const S={theme:'light',small:false,labels:true,mode:'ok',role:'owner',stack:[],layers:[],ui:{},toast:'',dir:'in',lastRoot:{},exitArmed:false,cur:null};
const $=(s,r=document)=>r.querySelector(s);
const ph=()=>$('#ph');
const topE=()=>S.stack[S.stack.length-1];
const defOf=id=>SCREENS[id];
const tabOfStack=()=>{for(let i=S.stack.length-1;i>=0;i--){const d=defOf(S.stack[i].id);if(d&&d.tab)return d.tab}return 'inbox'};
const showTabbar=()=>{const t=topE();const d=t&&defOf(t.id);return !!d&&d.kind==='root'};

/* ---------- navegación ---------- */
function go(id,p){
  const d=defOf(id);if(!d){console.warn('pantalla desconocida',id);return}
  if(id==='INB-11'&&p){const c=CONVS.find(x=>x.id===p.id);if(c)c.un=0}
  if(id==='EQP-02'&&p){const t=TEAMCHATS.find(x=>x.id===p.id);if(t)t.un=0}
  S.layers=[];
  if(d.kind==='root'){S.stack=[{id,p:p||d.p||{}}];S.dir='fade';S.lastRoot[d.tab]=id}
  else if(d.kind==='push'){S.stack.push({id,p:p||d.p||{}});S.dir='in'}
  else {S.layers=[{id,p:p||d.p||{}}]}
  render();
}
function tabTo(t){S.layers=[];const id=S.lastRoot[t]||TABROOT[t];S.stack=[{id,p:defOf(id).p||{}}];S.dir='fade';render()}
function back(){
  if(S.layers.length){S.layers.pop();render();return}
  if(S.stack.length>1){S.stack.pop();S.dir='back';render();return}
  const t=tabOfStack();
  if(t!=='inbox'||defOf(topE().id).id!=='INB-01'){tabTo('inbox');return}
  toast('Presiona Atrás otra vez para salir (simulado)');
}
function layer(id,p){S.layers.push({id,p:p||defOf(id).p||{}});render()}
function closeLayer(){S.layers.pop();render()}
/* abre una pantalla del índice con su contexto (para la revisión y las capturas) */
function show(id,p,ppo){
  const d=defOf(id);if(!d)return;
  const chain=[];let x=d;
  const params={};params[id]=p||d.p||{};
  while(x){chain.unshift(x);const pid=x.kind==='root'?null:(x.parent===null?null:(x.parent||TABROOT[x.tab||'inbox']));x=pid?defOf(pid):null}
  S.layers=[];S.ui={};S.toast='';
  if(d.mode){S.mode=d.mode;S.modeAuto=true}else if(S.modeAuto){S.mode='ok';S.modeAuto=false}
  if(d.enter)d.enter();
  syncTools();
  const stackDefs=chain.filter(c=>c.kind==='root'||c.kind==='push');
  S.stack=stackDefs.map(c=>({id:c.id,p:c.id===id?(p||c.p||{}):(ppo&&c.id===d.parent?ppo:d.pp&&c.id===d.parent?d.pp:(c.p||{}))}));
  if(d.kind==='sheet'||d.kind==='modal'||d.kind==='menu'){S.layers=[{id,p:p||d.p||{}}]}
  const rt=defOf(S.stack[0].id);if(rt&&rt.tab)S.lastRoot[rt.tab]=S.stack[0].id;
  S.dir='fade';render();
}
const toast=(m)=>{S.toast=m;clearTimeout(toast.t);render(true);toast.t=setTimeout(()=>{S.toast='';render(true)},2600)};

/* ---------- acciones simuladas ---------- */
Object.assign(ACT,{
  retry(){S.mode='ok';render()},
  send(){
    const cid=topE().p.id||'c1';const t=(S.ui.compose||'').trim();if(!t)return;
    const c=CONVS.find(x=>x.id===cid);if(!c||c.closed){return}
    (MSGS[cid]=MSGS[cid]||[]).push({w:'out',t,h:'ahora',st:'pending',sim:true});S.ui.compose='';S.ui.slash=false;
    c.prev=t;c.dir='out';c.st='pending';c.time='ahora';S.scrollThread=true;render();
    setTimeout(()=>{const m=MSGS[cid].slice(-1)[0];if(m){m.st='sent';c.st='sent';render(true)}},600);
    setTimeout(()=>{const m=MSGS[cid].slice(-1)[0];if(m){m.st='delivered';c.st='delivered';render(true)}},1400);
  },
  quick(p){const q=QUICK.find(x=>x.s===p.s);const c=CONVS.find(x=>x.id===(topE().p.id||'c1'));S.ui.compose=q.t.replace('{nombre}',c?c.name.split(' ')[0]:'');S.layers=[];S.ui.slash=false;render()},
  slashOn(){S.ui.slash=true;render()},
  attach(p){const cid=topE().p.id||'c1';const l={doc:'📎 Documento.pdf',foto:'📷 Foto',cam:'📷 Foto',loc:'📍 Ubicación',ctc:'👤 Contacto',lib:'📎 '+(p.n||'Archivo')}[p.k]||'📎 Archivo';
    (MSGS[cid]=MSGS[cid]||[]).push({w:'out',t:l,h:'ahora',st:'sent',sim:true});S.layers=[];S.scrollThread=true;render();toast('Simulado: no se envió nada')},
  setStage(p){const c=CONVS.find(x=>x.id===p.c);c.stage=p.s;const l=LEADS.find(x=>x.cid===p.c);if(l)l.stage=p.s;const ct=CONTACTS.find(x=>x.id===p.c);if(ct)ct.stage=p.s;S.layers=[];render();toast('Etapa: '+stageById(p.s).n)},
  setLeadStage(p){const l=LEADS.find(x=>x.id===p.l);l.stage=p.s;const c=CONVS.find(x=>x.id===l.cid);if(c)c.stage=p.s;S.layers=[];render();toast('Movido a '+stageById(p.s).n)},
  setAssignee(p){const c=CONVS.find(x=>x.id===p.c);c.as=p.u||null;S.layers=[];render();toast(p.u?'Asignado a '+userById(p.u).n:'Chat sin asignar')},
  toggleTag(p){const c=CONVS.find(x=>x.id===p.c);const i=c.tags.indexOf(p.t);if(i>=0)c.tags.splice(i,1);else c.tags.push(p.t);render()},
  setCm(p){S.cm=S.cm||{};S.cm[p.c]=p.v;render();toast(p.v==='meta'?'Este chat usa Meta':p.v==='directa'?'Este chat usa la conexión directa':'Este chat usa la conexión híbrida')},
  setAi(p){const c=CONVS.find(x=>x.id===p.c);c.ai=p.v;render();toast(p.v==='on'?'La IA atiende este chat':p.v==='pause'?'IA en pausa para este chat':'IA apagada en este chat')},
  takeChat(p){const c=CONVS.find(x=>x.id===p.c);c.ai='off';c.as=ME;render();toast('Tomaste el chat')},
  archive(p){const c=CONVS.find(x=>x.id===p.c);c.arch=!c.arch;S.layers=[];if(c.arch){S.stack=[{id:'INB-01',p:{}}]}render();toast(c.arch?'Chat archivado':'Chat recuperado')},
  del(p){const i=CONVS.findIndex(x=>x.id===p.c);if(i>=0){CONVS.splice(i,1)}S.layers=[];S.stack=[{id:'INB-01',p:{}}];render();toast('Chat eliminado (simulado)')},
  sel(p){S.ui.sel=S.ui.sel||[];const i=S.ui.sel.indexOf(p.c);if(i>=0)S.ui.sel.splice(i,1);else S.ui.sel.push(p.c);render()},
  selMode(p){S.ui.selMode=!!p.on;S.ui.sel=[];S.layers=[];render()},
  bulkAssign(){S.layers=[];const n=(S.ui.sel||[]).length;S.ui.selMode=false;S.ui.sel=[];render();toast('Simulado: '+n+' chat(es) asignados')},
  bulkArchive(){S.layers=[];(S.ui.sel||[]).forEach(id=>{const c=CONVS.find(x=>x.id===id);if(c)c.arch=true});S.ui.selMode=false;S.ui.sel=[];render();toast('Chats archivados')},
  readChat(p){const c=CONVS.find(x=>x.id===p.c);if(c)c.un=0},
  toggleTask(p){const t=TASKS0.find(x=>x.id===p.id);t.done=!t.done;render()},
  addTask(){const t=(S.ui.newtask||'').trim();if(!t)return;TASKS0.unshift({id:'k'+Date.now(),t,who:ME,due:'Hoy',cid:'',done:false,late:false});S.ui.newtask='';S.layers=[];render();toast('Tarea creada')},
  theme(){S.theme=S.theme==='dark'?'light':'dark';render()},
  ask(p){const q=(p&&p.q)||(S.ui.ask||'').trim();if(!q)return;S.ui.asked=S.ui.asked||[];S.ui.asked.push(q);S.ui.ask='';S.ui.thinking=true;S.scrollAst=true;render();setTimeout(()=>{S.ui.thinking=false;S.scrollAst=true;render()},1100)},
  apply(p){S.ui['applied_'+p.k]=true;render();toast('Simulado: acción aplicada (no se envió nada)')},
  leadMove(p){S.layers=[];render()},
  step(p){S.ui.wiz=Math.max(1,Math.min(5,(S.ui.wiz||1)+p.d));render()},
  prevSend(){const t=(S.ui.prev||'').trim();if(!t)return;S.ui.prevm=S.ui.prevm||[];S.ui.prevm.push(t);S.ui.prev='';S.ui.prevThink=true;render();setTimeout(()=>{S.ui.prevThink=false;render()},900)},
  search(){S.ui.q=''; render()},
  closeToast(){S.toast='';render(true)},
  finishSplash(){go('INB-01')},
  logout(){go('AUTH-02')},
  login(){tabTo('inbox')},
  done(p){S.layers=[];render();toast(p&&p.m||'Listo (simulado)')},
  pop(){back()}
});

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target;if(!t.closest)return;
  const el=t.closest('[data-go],[data-tab],[data-back],[data-sheet],[data-close],[data-act],[data-toast],[data-set],[data-flip],[data-url]');
  if(!el){const b=t.closest('button');if(b&&ph()&&ph().contains(b)&&!b.closest('[data-act],[data-go]')){
      if(b.classList.contains('chip')||b.closest('.cal-days')||b.closest('.tabs-u')||b.closest('.range')){const sib=b.parentElement.querySelectorAll(':scope > button');const multi=b.closest('[data-multi]');if(!multi)sib.forEach(x=>x.classList.remove('on'));b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'));return}
      if(b.classList.contains('off')||b.disabled)return;
      toast('Simulado: '+((b.getAttribute('aria-label')||b.textContent||'acción').trim().slice(0,40)));}
    return}
  if(!ph()||!ph().contains(el))return;
  const p=el.dataset.p?JSON.parse(el.dataset.p.replace(/&#39;/g,"'")):undefined;
  if(el.dataset.back!==undefined)return back();
  if(el.dataset.close!==undefined)return closeLayer();
  if(el.dataset.tab)return tabTo(el.dataset.tab);
  if(el.dataset.go)return go(el.dataset.go,p);
  if(el.dataset.sheet)return layer(el.dataset.sheet,p);
  if(el.dataset.set!==undefined){const i=el.dataset.set.indexOf('=');S.ui[el.dataset.set.slice(0,i)]=el.dataset.set.slice(i+1);return render()}
  if(el.dataset.flip){const k=el.dataset.flip;S.ui[k]=!ui(k,el.dataset.fd==='1');return render()}
  if(el.dataset.url)return toast('Se abre fuera de la app (simulado)');
  if(el.dataset.toast)return toast(el.dataset.toast);
  if(el.dataset.act){const f=ACT[el.dataset.act];if(!f){console.warn('acción desconocida',el.dataset.act);return}return f(p||{},el)}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;S.ui[k]=e.target.value;render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&!e.shiftKey){e.preventDefault();ACT[e.target.dataset.enter](P_(e.target))}
  if(e.key==='Escape'){if(S.layers.length)closeLayer()}
});
const P_=el=>el.dataset.p?JSON.parse(el.dataset.p.replace(/&#39;/g,"'")):{};

/* ---------- render ---------- */
function layerHtml(l){
  const d=defOf(l.id);const inner=d.render(l.p||{});
  if(d.kind==='modal')return `<div class="layer center"><div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  if(d.kind==='menu')return `<div class="layer menuL"><div class="scrim" style="background:transparent" data-close></div><div class="menu" role="menu" style="${d.pos||''}">${inner}</div></div>`;
  return `<div class="layer"><div class="scrim" data-close></div><div class="sheet ${d.size||''}" role="dialog" aria-modal="true">${inner}</div></div>`;
}
function tabbarHtml(){
  const cur=tabOfStack();
  const unread=CONVS.filter(c=>c.un>0&&!c.arch).length+TEAMCHATS.reduce((a,t)=>a+(t.un?1:0),0);
  return `<nav class="tabbar" aria-label="Navegación principal">${ROLE_TABS[S.role].map(k=>`<button data-tab="${k}" class="${k===cur?'on':''}" ${k===cur?'aria-current="page"':''}><span class="ibx">${ic(TABS[k].i)}${k==='inbox'&&unread?`<span class="n">${unread}</span>`:''}</span>${TABS[k].l}</button>`).join('')}</nav>`;
}
function render(soft){
  const root=ph();if(!root)return;
  root.dataset.theme=S.theme;
  root.classList.toggle('small',S.small);
  const t=topE();if(!t)return;
  const d=defOf(t.id);
  const app=$('.app',root);
  /* guarda foco y desplazamientos */
  const ae=document.activeElement;const fk=ae&&ae.dataset&&ae.dataset.in;const sel=fk?[ae.selectionStart,ae.selectionEnd]:null;
  const sc={};app.querySelectorAll('[data-sk]').forEach(n=>sc[n.dataset.sk]=n.scrollTop);
  const same=S.cur===t.id+JSON.stringify(t.p);
  let body='';
  try{body=d.render(t.p||{})}catch(err){console.error(t.id,err);body=`<div class="empty err"><h3>Error de pantalla</h3><p>${esc(t.id)}: ${esc(err.message)}</p></div>`}
  const tb=showTabbar()?tabbarHtml():'';
  let lay='';S.layers.forEach(l=>{try{lay+=layerHtml(l)}catch(err){console.error(l.id,err)}});
  const cls=same||soft?'':(S.dir==='back'?'back':S.dir==='fade'?'fade':'');
  app.innerHTML=`<div class="view ${cls}" data-v="${t.id}">${body}</div>${tb}${lay}${S.toast?`<div class="toast ${showTabbar()?'':'top'}" role="status">${ic('info','m')}${esc(S.toast)}</div>`:''}`;
  S.cur=t.id+JSON.stringify(t.p);
  app.querySelectorAll('[data-sk]').forEach(n=>{if(sc[n.dataset.sk]!=null&&same)n.scrollTop=sc[n.dataset.sk]});
  const th=app.querySelector('.thread');if(th&&(S.scrollThread||!same)){th.scrollTop=th.scrollHeight;S.scrollThread=false}
  const as=app.querySelector('[data-sk="ast"]');if(as&&(S.scrollAst||!same)){as.scrollTop=as.scrollHeight;S.scrollAst=false}
  if(fk){const n=app.querySelector(`[data-in="${fk}"]`);if(n){n.focus();try{n.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  /* etiqueta de revisión */
  const rv=$('#rv');const top=S.layers.length?defOf(S.layers[S.layers.length-1].id):d;
  rv.className='rv '+(top.status==='propuesta'?'':top.status==='adaptada'?'adap':'web');
  rv.textContent=top.status==='propuesta'?'NUEVA EN MÓVIL · aprobada por Fer':top.status==='adaptada'?'ADAPTADA DEL CRM WEB':'FUNCIÓN ACTUAL DEL CRM';
  rv.style.display=S.labels?'':'none';
  root.classList.toggle('hidebar',false);
  updateChrome(top);
}
function updateChrome(d){
  const cap=$('#cap');if(!cap)return;
  const stT={actual:['web','Función actual'],adaptada:['adap','Adaptada a móvil'],propuesta:['prop','Propuesta nueva']}[d.status]||['web',''];
  cap.innerHTML=`<div class="r"><b>${esc(d.title)}</b><code>${d.id}</code><span class="tg ${stT[0]}" style="font-size:11px;padding:1px 7px;border-radius:9px">${stT[1]}</span></div><div>${d.web?`Web: <code>${esc(d.web)}</code> · `:''}${esc(d.note||'')}</div>`;
  document.querySelectorAll('#side .it').forEach(b=>b.classList.toggle('cur',b.dataset.id===d.id));
  document.title=d.id+' · '+d.title+' — Dashfort Mobile (prototipo)';
}

/* ---------- panel de revisión ---------- */
function buildSide(){
  const q=($('#sq')&&$('#sq').value||'').toLowerCase();
  const groups={};
  ORDER.forEach(id=>{const d=SCREENS[id];const g=id.split('-')[0];(groups[g]=groups[g]||[]).push(d)});
  let h='';
  Object.keys(MODS).forEach(g=>{
    const items=(groups[g]||[]).filter(d=>!q||(d.title+d.id).toLowerCase().includes(q));
    if(!items.length)return;
    h+=`<div class="grp">${MODS[g]} · ${items.length}</div>`+items.map(d=>`<button class="it" data-id="${d.id}"><code>${d.id}</code><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.title)}</span>${d.status!=='actual'?`<span class="tg ${d.status==='propuesta'?'prop':'adap'}">${d.status==='propuesta'?'propuesta':'adaptada'}</span>`:''}</button>`).join('');
  });
  $('#idx').innerHTML=h||'<div class="grp">Sin resultados</div>';
  $('#idx').querySelectorAll('.it').forEach(b=>b.onclick=()=>{show(b.dataset.id);if(matchMedia('(max-width:620px)').matches)$('#side').classList.remove('open')});
}
function syncTools(){
  document.querySelectorAll('#side .tools button').forEach(b=>{
    const k=b.dataset.k,v=b.dataset.v;
    b.classList.toggle('on',k==='theme'?S.theme===v:k==='mode'?S.mode===v:k==='role'?S.role===v:k==='small'?String(S.small)===v:k==='labels'?String(S.labels)===v:false);
  });
}
function wireTools(){
  document.querySelectorAll('#side .tools button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=b.dataset.v;
    if(k==='theme')S.theme=v;else if(k==='mode')S.mode=v;else if(k==='role'){S.role=v;const t=tabOfStack();if(!ROLE_TABS[v].includes(t))tabTo('inbox')}
    else if(k==='small')S.small=v==='true';else if(k==='labels')S.labels=v==='true';
    syncTools();render();
  });
  $('#sq').oninput=buildSide;
  $('#revbtn').onclick=()=>$('#side').classList.toggle('open');
}

function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get('theme'))S.theme=q.get('theme');
  if(q.get('state'))S.mode=q.get('state');
  if(q.get('role'))S.role=q.get('role');
  if(q.get('small')==='1')S.small=true;
  if(q.get('labels')==='0')S.labels=false;
  if(q.get('clean')==='1')document.body.classList.add('clean');
  if(matchMedia('(max-width:620px)').matches)ph().classList.add('nobar');
  buildSide();wireTools();syncTools();
  const id=(location.hash||'').replace(/^#\/?/,'')||q.get('s')||'AUTH-01';
  S.stack=[];
  if(SCREENS[id])show(id);else show('AUTH-01');
  window.addEventListener('hashchange',()=>{const i=location.hash.replace(/^#\/?/,'');if(SCREENS[i])show(i)});
}
window.addEventListener('DOMContentLoaded',boot);
</script>
</body></html>
