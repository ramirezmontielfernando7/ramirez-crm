  --border:#e6e6eb; --border-strong:#d8d8de; --row-press:#f0f0f3; --chip-bg:#ffffff;
  /* acento (white-label: la organización lo cambia; aquí el teal de fábrica) */
  --accent:#0e7c80; --accent-press:#0b6a6d; --accent-wash:#e3f3f3; --accent-tint:#ebf6f6; --accent-ink:#0b6a6d; --accent-fg:#ffffff;
  --brand-teal:#12999d;
  /* estado */
  --success:#1fb35b; --success-tint:#e9f7ee; --success-text:#157a41;
  --warning:#f2a71b; --warning-tint:#fef6e6; --warning-text:#935f0b;
  --danger:#d94a4a; --danger-tint:#fdf0f0; --danger-text:#b73535;
  --info:#0d5bff; --info-tint:#ebf1ff; --info-text:#0038d8;
  /* chat */
  --chat-bg:#f1f2f4; --bubble-in:#ffffff; --bubble-in-border:#e6e6eb; --bubble-out:#d7efef; --bubble-out-text:#073b3d;
  --bubble-ai:#e9e4fb; --bubble-ai-text:#2c1e5c; --bubble-ai-who:#5b3fb8; --bubble-conn:#e3ecff; --bubble-conn-text:#12306b; --tick-read:#2aa1d6;
  --tag-bg:#eef2ff; --tag-text:#4338ca;
  --scrim:rgba(17,24,39,.42);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 4px 14px -6px rgba(0,0,0,.08);
  --shadow-float:0 8px 28px -8px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.06);
  /* medidas */
  --r-control:12px; --r-card:16px; --r-sheet:22px; --r-pill:999px;
  --safe-top:44px; --safe-bottom:20px; --tabbar-h:72px;
}
.ph[data-theme="dark"]{
  color-scheme:dark;
  --surface-base:#10172a; --surface:#1c263c; --surface-sunken:#141c30; --surface-raised:#222d47;
  --text:#e8eefc; --text-2:#bac6e3; --text-3:#9aa9ca; --text-4:#7888ad;
  --border:#36476f; --border-strong:#4a5d8e; --row-press:#212c45; --chip-bg:#26334d;
  --accent:#12999d; --accent-press:#38a9ad; --accent-wash:#1d4554; --accent-tint:#1a3f51; --accent-ink:#63bcbe; --accent-fg:#0f1419;
  --success:#4fd07f; --success-tint:#183e26; --success-text:#7fe0a3;
  --warning:#f5b74a; --warning-tint:#40300f; --warning-text:#f8cf85;
  --danger:#ef7373; --danger-tint:#431f25; --danger-text:#f5a3a3;
  --info:#7aa2ff; --info-tint:#1c2a52; --info-text:#a9c3ff;
  --chat-bg:#141c30; --bubble-in:#27324f; --bubble-in-border:#44527a; --bubble-out:#1f5560; --bubble-out-text:#e8eefc;
  --bubble-ai:#2f2754; --bubble-ai-text:#ece7ff; --bubble-ai-who:#c4b0f5; --bubble-conn:#1e3566; --bubble-conn-text:#dbe6ff; --tick-read:#53bdeb;
  --tag-bg:#252f5e; --tag-text:#b4bdff;
  --scrim:rgba(0,0,0,.6);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.55);
  --shadow-float:0 10px 30px -8px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-ui);background:#e9ebee;color:#1d1d1f;font-size:15px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.s{width:16px;height:16px}svg.i.m{width:18px;height:18px}svg.i.l{width:26px;height:26px}svg.i.xl{width:34px;height:34px}

/* ---------- escenario de revisión (solo escritorio) ---------- */
#stage{display:flex;height:100%}
#side{width:330px;flex-shrink:0;background:#fff;border-right:1px solid #e3e5e8;display:flex;flex-direction:column;overflow:hidden}
#side .head{padding:18px 18px 12px;border-bottom:1px solid #eceef0}
#side .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:#0e7c80}
#side .brand small{display:block;font-weight:400;color:#6e6e73;font-size:12px}
#side .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#side .tools button{font-size:12px;padding:5px 10px;border:1px solid #d8dbe0;border-radius:999px;background:#fff;color:#333}
#side .tools button.on{background:#e3f3f3;border-color:#0e7c80;color:#0a5e61;font-weight:600}
#side .search{margin:10px 18px 0;height:34px;border:1px solid #d8dbe0;border-radius:10px;padding:0 10px;font-size:13px;width:calc(100% - 36px)}
#side .idx{flex:1;overflow:auto;padding:6px 8px 20px}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6e6e73;font-weight:600;padding:14px 10px 4px}
#side .it{display:flex;gap:8px;align-items:center;width:100%;padding:6px 10px;border-radius:8px;font-size:13px;color:#1d1d1f}
#side .it:hover{background:#f3f4f6}
#side .it.cur{background:#e3f3f3;color:#0a5e61;font-weight:600}
#side .it code{font-size:10.5px;color:#6e6e73;background:#f1f2f4;border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;flex-shrink:0}
#side .it .tg{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:8px;flex-shrink:0}
.tg.prop{background:#fff3c4;color:#7a5200}.tg.adap{background:#e2ebff;color:#1c3d99}.tg.web{background:#eee;color:#555}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;padding:16px;overflow:hidden}
#cap{width:390px;max-width:100%;font-size:13px;color:#48484d;display:flex;flex-direction:column;gap:4px;min-height:58px}
#cap b{color:#1d1d1f;font-size:14px}
#cap .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#cap code{font-size:11px;background:#fff;border:1px solid #dde0e4;border-radius:5px;padding:0 5px;font-family:ui-monospace,Menlo,monospace}
#hint{font-size:11.5px;color:#6e6e73;text-align:center}

/* ---------- teléfono ---------- */
.ph{width:390px;height:844px;border-radius:46px;background:var(--surface);color:var(--text);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #1f2329,0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;font-family:var(--font-ui);font-size:15px;transition:background .2s,color .2s}
.ph.small{width:360px;height:640px;border-radius:34px}
.ph.small .status{height:34px}
.ph.small{--safe-top:34px;--safe-bottom:12px}
.status{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;background:var(--surface);position:relative;z-index:2;color:var(--text)}
.status span:last-child{letter-spacing:2px;font-size:12px}
.ph.nobar .status{display:none}
.ph.nobar{--safe-top:0px}
.rv{position:absolute;left:50%;top:-30px;transform:translateX(-50%);z-index:60;font-size:10px;font-weight:600;padding:2px 9px;border-radius:9px;background:#fff3c4;color:#7a5200;letter-spacing:.03em;pointer-events:none;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rv.adap{background:#e2ebff;color:#1c3d99}.rv.web{background:#eee;color:#444}
.app{flex:1;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);animation:vin .22s ease-out}
.view.back{animation:vback .2s ease-out}
@keyframes vin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes vback{from{transform:translateX(-18px);opacity:.5}to{transform:none;opacity:1}}
.view.fade{animation:vfade .18s ease-out}@keyframes vfade{from{opacity:.3}to{opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad-tab{padding-bottom:calc(var(--tabbar-h) + 28px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- barra superior ---------- */
.appbar{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 16px;min-height:52px;flex-shrink:0;background:var(--surface)}
.appbar.sub{padding-left:4px}
.appbar h1{font-size:26px;line-height:32px;font-weight:600;color:var(--accent-ink);letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar h2{font-size:17px;line-height:22px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar h2 small{display:block;font-size:12.5px;line-height:16px;font-weight:400;color:var(--text-3)}
.ib{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;position:relative}
.ib:active{background:var(--row-press)}
.ib .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.ib.tx{width:auto;padding:0 12px;border-radius:22px;font-size:15px;font-weight:600;color:var(--accent-ink)}

/* ---------- segmentado / chips ---------- */
.seg{display:flex;gap:2px;margin:6px 16px 4px;background:var(--surface-sunken);border-radius:24px;padding:4px;flex-shrink:0}
.seg button{flex:1;height:40px;border-radius:20px;font-size:14.5px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--accent-ink);font-weight:600;box-shadow:var(--shadow-card)}
.seg .n{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.chips{display:flex;gap:8px;padding:8px 16px 6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--border-strong);font-size:14px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;background:var(--surface)}
.chip.on{background:var(--accent-wash);border-color:transparent;color:var(--accent-ink);font-weight:600}
.chip b{font-weight:600}
.tabs-u{display:flex;gap:4px;padding:0 12px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs-u::-webkit-scrollbar{display:none}
.tabs-u button{height:44px;padding:0 12px;font-size:14.5px;font-weight:500;color:var(--text-3);white-space:nowrap;position:relative}
.tabs-u button.on{color:var(--accent-ink);font-weight:600}
.tabs-u button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:2px;background:var(--accent)}

/* ---------- búsqueda ---------- */
.searchbox{margin:6px 16px 4px;height:44px;border-radius:22px;background:var(--surface-sunken);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--text-3);flex-shrink:0}
.searchbox input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;color:var(--text)}
.searchbox input::placeholder{color:var(--text-3)}

/* ---------- filas de lista ---------- */
.row{display:flex;gap:13px;padding:11px 16px;align-items:center;width:100%;position:relative}
.row:active,.row.sel{background:var(--row-press)}
.row.open{background:var(--accent-tint)}
.row .body{flex:1;min-width:0}
.l1,.l2,.l3{display:flex;align-items:center;gap:6px;min-width:0}
.name{font-size:16px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--text-3);flex-shrink:0}.time.u{color:var(--accent-ink);font-weight:600}
.prev{font-size:14px;color:var(--text-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.l3{margin-top:5px;gap:6px;flex-wrap:nowrap;overflow:hidden}
.badge{min-width:21px;height:21px;border-radius:11px;background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0;margin-top:2px}
.badge.mute{background:var(--text-4);color:#fff}
.tk{color:var(--text-3);display:inline-flex;margin-right:3px;vertical-align:-2px}.tk.read{color:var(--tick-read)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.cap2{font-size:12px;padding:2px 9px 2px 7px;border-radius:10px;background:var(--surface-sunken);color:var(--text-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;max-width:100%}
.cap2.tag{background:var(--tag-bg);color:var(--tag-text);padding-left:9px}
.cap2.more{padding:2px 7px}
.sep{height:1px;background:var(--border);margin:0 16px 0 80px}
.sep.full{margin:0}
.group-h{font-size:12.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding:18px 18px 6px}
.item{display:flex;align-items:center;gap:16px;padding:13px 18px;font-size:15.5px;width:100%;min-height:52px}
.item:active{background:var(--row-press)}
.item .i{color:var(--text-2)}
.item em{margin-left:auto;font-style:normal;font-size:13.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px}
.item small{display:block;font-size:13px;color:var(--text-3);margin-top:1px}
.item .grow{flex:1;min-width:0}
.item .grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.dang{color:var(--danger-text)}.item.dang .i{color:var(--danger-text)}
.item .ico{width:36px;height:36px;border-radius:10px;background:var(--accent-wash);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- avatar ---------- */
.av{width:50px;height:50px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0;position:relative}
.av.sm{width:34px;height:34px;font-size:12.5px}.av.md{width:40px;height:40px;font-size:14px}.av.lg{width:64px;height:64px;font-size:21px}.av.xl{width:84px;height:84px;font-size:27px}
.av .bot{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.av .bot span{width:10px;height:10px;border-radius:50%;background:var(--success)}
.av .bot span.p{background:var(--warning)}.av .bot span.o{background:var(--text-4)}
.av.grp{background:var(--surface-sunken);color:var(--text-2)}

/* ---------- botones ---------- */
.btn{height:48px;border-radius:var(--r-control);padding:0 20px;font-size:15.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-width:48px}
.btn.p{background:var(--accent);color:var(--accent-fg)}.btn.p:active{background:var(--accent-press)}
.btn.s{background:var(--surface);border:1px solid var(--border-strong);color:var(--text)}
.btn.t{background:var(--accent-wash);color:var(--accent-ink)}
.btn.g{color:var(--accent-ink)}
.btn.d{background:var(--danger);color:#fff}
.btn.dd{background:var(--danger-tint);color:var(--danger-text)}
.btn.block{width:100%}.btn.sm{height:38px;font-size:14px;padding:0 14px;border-radius:10px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.fab{position:absolute;right:18px;bottom:calc(var(--tabbar-h) + 30px);width:56px;height:56px;border-radius:17px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px rgba(14,124,128,.55);z-index:5}
.fab.ext{width:auto;padding:0 18px;gap:8px;font-weight:600;font-size:15px}
.fab.nobar{bottom:24px}

/* ---------- campos ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin:0 16px 14px}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.field .hint{font-size:12.5px;color:var(--text-3)}
.field .err{font-size:12.5px;color:var(--danger-text);display:flex;gap:6px;align-items:center}
.inp{height:48px;border:1px solid var(--border-strong);border-radius:var(--r-control);padding:0 14px;font-size:16px;background:var(--surface);width:100%;outline:0;color:var(--text)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.bad{border-color:var(--danger)}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:none;line-height:1.4}
.sel{position:relative}.sel .inp{display:flex;align-items:center;justify-content:space-between;color:var(--text)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--border-strong);position:relative;flex-shrink:0;transition:background .15s;margin-left:auto}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk.r{border-radius:50%}
.opt{display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;min-height:50px}
.opt:active{background:var(--row-press)}
.opt .grow{flex:1;min-width:0}.opt small{display:block;color:var(--text-3);font-size:13px}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin:0 16px 12px;overflow:hidden}
.card.pad{padding:14px 16px}
.card.sunk{background:var(--surface-sunken);border-color:transparent}
.card h3{font-size:15px;font-weight:600}
.card .sub{font-size:13px;color:var(--text-3)}
.ph .band{height:8px;background:var(--surface-sunken);flex-shrink:0}
.surf-sunk{background:var(--surface-sunken)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px}
.kpi small{font-size:12.5px;color:var(--text-3);display:block}
.kpi b{font-size:22px;font-weight:600;display:block;margin-top:2px;line-height:1.2}
.kpi i{font-style:normal;font-size:12px;font-weight:600}
.kpi i.up{color:var(--success-text)}.kpi i.dn{color:var(--danger-text)}
.banner{display:flex;gap:10px;align-items:flex-start;margin:8px 16px;padding:11px 12px;border-radius:12px;font-size:13.5px;line-height:1.35}
.banner .i{margin-top:1px}
.banner.info{background:var(--info-tint);color:var(--info-text)}.banner.warn{background:var(--warning-tint);color:var(--warning-text)}
.banner.err{background:var(--danger-tint);color:var(--danger-text)}.banner.ok{background:var(--success-tint);color:var(--success-text)}
.banner.ai{background:var(--bubble-ai);color:var(--bubble-ai-text)}
.banner .grow{flex:1}.banner button{font-weight:600;text-decoration:underline;white-space:nowrap}
.status-pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.status-pill.ok{background:var(--success-tint);color:var(--success-text)}.status-pill.warn{background:var(--warning-tint);color:var(--warning-text)}
.status-pill.err{background:var(--danger-tint);color:var(--danger-text)}.status-pill.mute{background:var(--surface-sunken);color:var(--text-3)}.status-pill.ai{background:var(--bubble-ai);color:var(--bubble-ai-who)}.status-pill.info{background:var(--info-tint);color:var(--info-text)}
.progress{height:8px;border-radius:4px;background:var(--surface-sunken);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.progress.warn i{background:var(--warning)}.progress.err i{background:var(--danger)}

/* ---------- estados: cargando / vacío / error ---------- */
.skel{background:linear-gradient(90deg,var(--surface-sunken) 25%,color-mix(in srgb,var(--surface-sunken) 60%,var(--surface)) 50%,var(--surface-sunken) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* Piezas de interfaz reutilizables (en la especificación son los componentes de React Native). */
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const P=o=>`data-p='${JSON.stringify(o).replace(/'/g,'&#39;')}'`;
const initials=n=>{const w=String(n).replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[1][0]:'')).toUpperCase()};
const ui=(k,d)=>S.ui[k]===undefined?d:S.ui[k];

const avatar=(name,cls='',ai)=>`<span class="av ${cls}">${esc(initials(name))}${ai?`<span class="bot" title="IA"><span class="${ai==='pause'?'p':ai==='off'?'o':''}"></span></span>`:''}</span>`;
const stageCap=id=>{const s=stageById(id);return s?`<span class="cap2"><span class="dot" style="background:${s.col}"></span>${esc(s.n)}</span>`:''};
const tagCap=id=>{const t=tagById(id);return t?`<span class="cap2 tag">${esc(t.n)}</span>`:''};
const tagsCaps=(ids,max=2)=>ids.slice(0,max).map(tagCap).join('')+(ids.length>max?`<span class="cap2 more">+${ids.length-max}</span>`:'');
const ticks=st=>st==='failed'?`<span class="tk" style="color:var(--danger)">${ic('triangle-alert','s')}</span>`:st==='read'?`<span class="tk read">${ic('check-check','s')}</span>`:st==='delivered'?`<span class="tk">${ic('check-check','s')}</span>`:st==='sent'?`<span class="tk">${ic('check','s')}</span>`:st==='pending'?`<span class="tk">${ic('clock-3','s')}</span>`:'';

/* barra superior: título grande (raíz) o título pequeño con Atrás */
const ib=(icon,attr,label,extra='')=>`<button class="ib" aria-label="${esc(label)}" ${attr}>${ic(icon)}${extra}</button>`;
const bar=(title,o={})=>o.big
  ?`<header class="appbar"><h1>${esc(title)}</h1>${(o.right||[]).join('')}</header>`
  :`<header class="appbar sub">${ib('arrow-left','data-back','Atrás')}<h2>${esc(title)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</h2>${(o.right||[]).join('')}</header>`;

const seg=(items,cur,mk)=>`<div class="seg" role="tablist">${items.map(i=>`<button role="tab" aria-selected="${i.k===cur}" class="${i.k===cur?'on':''}" ${mk(i)}>${esc(i.l)}${i.n?`<span class="n">${i.n}</span>`:''}</button>`).join('')}</div>`;
const chips=(items,cur,key)=>`<div class="chips">${items.map(i=>`<button class="chip ${i.k===cur?'on':''}" data-set="${key}=${i.k}">${esc(i.l)}${i.n!=null?`<b>${i.n}</b>`:''}</button>`).join('')}</div>`;
const tabsU=(items,cur)=>`<div class="tabs-u" role="tablist">${items.map(i=>`<button role="tab" aria-selected="${i.k===cur}" class="${i.k===cur?'on':''}" ${i.a}>${esc(i.l)}</button>`).join('')}</div>`;
const searchBox=(key,ph,extra='')=>`<div class="searchbox">${ic('search','m')}<input data-in="${key}" value="${esc(ui(key,''))}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off">${ui(key,'')?`<button class="ib sm" data-set="${key}=" aria-label="Borrar búsqueda">${ic('x','m')}</button>`:''}${extra}</div>`;

const item=(icon,label,o={})=>`<button class="item ${o.dang?'dang':''}" ${o.a||''}>${icon?(o.box?`<span class="ico">${ic(icon,'m')}</span>`:ic(icon,'i'))+'':''}<span class="grow"><span>${esc(label)}</span>${o.sub?`<small>${esc(o.sub)}</small>`:''}</span>${o.end!=null?`<em>${o.end}</em>`:''}${o.chev?ic('chevron-right','m'):''}</button>`;
const sw=(on,a)=>`<span class="sw ${on?'on':''}" role="switch" aria-checked="${!!on}" ${a||''}></span>`;
const swItem=(label,key,def,sub)=>{const on=ui(key,def);return `<button class="item" data-flip="${key}" data-fd="${def?1:0}"><span class="grow"><span>${esc(label)}</span>${sub?`<small>${esc(sub)}</small>`:''}</span>${sw(on)}</button>`};
const group=t=>`<div class="group-h">${esc(t)}</div>`;
const card=(inner,cls='')=>`<div class="card ${cls}">${inner}</div>`;

/* formularios (con <input> reales: se puede escribir en el prototipo) */
const field=(label,key,o={})=>`<div class="field"><label for="f_${key}">${esc(label)}</label>${o.area?`<textarea class="inp" id="f_${key}" data-in="${key}" placeholder="${esc(o.ph||'')}">${esc(ui(key,o.val||''))}</textarea>`:`<input class="inp ${o.bad?'bad':''}" id="f_${key}" data-in="${key}" value="${esc(ui(key,o.val||''))}" placeholder="${esc(o.ph||'')}" ${o.type?`type="${o.type}"`:''} autocomplete="off">`}${o.bad?`<span class="err">${ic('circle-alert','s')}${esc(o.bad)}</span>`:o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`;
const pick=(label,val,a,o={})=>`<div class="field"><label>${esc(label)}</label><button class="inp sel" ${a} style="text-align:left"><span style="display:flex;align-items:center;gap:8px;min-width:0">${o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(val)}</span></span>${ic('chevron-down','m')}</button>${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`;
const opt=(label,on,a,o={})=>`<button class="opt" ${a}>${o.lead||''}<span class="grow">${esc(label)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</span><span class="chk ${o.radio?'r':''} ${on?'on':''}">${ic('check','s')}</span></button>`;

const unreadN=()=>CONVS.filter(c=>c.un>0&&!c.arch).length;
const teamUn=()=>TEAMCHATS.reduce((a,t)=>a+(t.un?1:0),0);
const inboxSeg=cur=>seg([{k:'cli',l:'Clientes',n:unreadN()||''},{k:'eq',l:'Equipo',n:teamUn()||''},{k:'num',l:'Mi número'}],cur,i=>`data-go="${{cli:'INB-01',eq:'EQP-01',num:'NUM-01'}[i.k]}"`);
function filteredConvs(){
  const f=ui('chip','todos'),q=ui('q','').toLowerCase().trim();
  let l=CONVS.filter(c=>f==='arch'?c.arch:!c.arch);
  if(f==='unread')l=l.filter(c=>c.un>0);if(f==='mine')l=l.filter(c=>c.as===ME);if(f==='grp')l=l.filter(c=>c.grp);
  if(ui('f_stage','all')!=='all')l=l.filter(c=>c.stage===ui('f_stage'));
  if(ui('f_tag','all')!=='all')l=l.filter(c=>c.tags.includes(ui('f_tag')));
  if(ui('f_who','all')==='none')l=l.filter(c=>!c.as);if(ui('f_who','all')==='mine')l=l.filter(c=>c.as===ME);
  if(q)l=l.filter(c=>(c.name+c.prev+c.phone+c.tags.map(t=>tagById(t).n).join(' ')).toLowerCase().includes(q));
  return l;
}
function convRow(c){

  return `<button class="row ${on?'sel':''}" ${a} aria-label="${esc(c.name)}${c.un?', '+c.un+' sin leer':''}">${lead}${av}<span class="body"><span class="l1"><span class="name">${esc(c.name)}</span><span class="time ${c.un?'u':''}">${c.time}</span></span><span class="l2"><span class="prev">${c.dir==='out'?ticks(c.st||'read'):''}${esc(c.prev)}</span>${c.un?`<span class="badge">${c.un}</span>`:''}</span><span class="l3">${c.stage?stageCap(c.stage):`<span class="cap2">Grupo de WhatsApp</span>`}${tagsCaps(c.tags,2)}</span></span></button>`;
}

function inboxBody(){

  return l.map(convRow).join('');
}

  const unr=unreadN();
  const chipsH=(s||q)?'':inboxSeg('cli')+chips([{k:'todos',l:'Todos'},{k:'unread',l:'No leídos',n:unr},{k:'mine',l:'Míos'},{k:'camp',l:'Campañas',n:CAMP_PENDING.length},{k:'grp',l:'Grupos'}],ui('chip','todos'),'chip');
  const sub=q&&ui('q','')?`<div class="group-h" style="padding-top:8px">Resultados en Clientes</div>`:'';
  const af=(ui('f_stage','all')!=='all'||ui('f_tag','all')!=='all'||ui('f_who','all')!=='all');
  const flt=af&&!q&&!s?`<div class="chips" style="padding-top:0"><button class="chip on" data-sheet="INB-05">${ic('sliders-horizontal','s')}Filtros activos${ic('x','s')}</button></div>`:'';
  const arch=ui('chip','todos')==='arch'?`<div class="chips" style="padding-top:0"><button class="chip on" data-set="chip=todos">${ic('archive','s')}Archivados ${ic('x','s')}</button></div>`:'';
  const body=V({ok:inboxBody(),empty:emptyS('inbox','Aún no tienes chats','Cuando un cliente escriba a tu WhatsApp, su conversación aparecerá aquí.'),loading:skel(8)});
  return `${head}${chipsH}${flt}${arch}${sub}<div class="scroll pad-tab" data-sk="inb">${body}</div>${s?`<div class="foot" style="padding:10px 16px calc(var(--safe-bottom) + 4px);border-top:1px solid var(--border);display:flex;gap:10px"><button class="btn t block" data-sheet="INB-22" ${P({c:'bulk'})}>${ic('user-plus','m')}Asignar</button><button class="btn s block" data-act="bulkArchive">${ic('archive','m')}Archivar</button></div>`:`<button class="fab" data-sheet="INB-10" aria-label="Nuevo chat">${ic('message-square-plus')}</button>`}`;
}

/* ===== CHAT ===== */
function bubble(m,c){
  if(m.d)return `<div class="day">${esc(m.d)}</div>`;
  if(m.e)return `<div class="evt">${ic('sparkles','s')}— ${esc(m.e)} —</div>`;
  if(m.note)return `<div class="evt note">${ic('sticky-note','s')}<span><b>Nota interna</b> · ${esc(m.t)}</span></div>`;
  const cls=m.w==='in'?'in':m.w==='ai'?'ai':m.w==='conn'?'conn':'out';
  const who=m.w==='ai'?`<div class="who">${ic('sparkles','s')}IA</div>`:m.w==='conn'?`<div class="who">${ic('sparkles','s')}Joe · IA de Ana</div>`:m.who&&m.w==='in'?`<div class="who" style="color:var(--accent-ink)">${esc(m.who)}</div>`:'';
  const att=m.img?`<div class="img" role="img" aria-label="Imagen">${ic('image','xl')}</div>`:'';
  return `<div class="b ${cls} ${m.st==='failed'?'fail':''}">${who}${att}${esc(m.t)}<span class="m">${esc(m.h)}${m.w!=='in'&&m.st?ticks(m.st):''}</span>${m.fl?`<span class="fl">${ic('triangle-alert','s')} ${esc(m.fl)}</span>`:''}</div>`;
}
function chatScreen(p){
  const c=CONVS.find(x=>x.id===p.id)||CONVS[0];
  const msgs=(MSGS[c.id]||[{d:'Hoy'}]);
  const a=c.as?userById(c.as).n:'Sin asignar';
  const sub=c.grp?`<span class="t">Grupo · 24 participantes</span>`:`<span class="dot" style="background:${stageById(c.stage).col}"></span><span class="t">${stageById(c.stage).n} · ${esc(a)}</span>`;
  const text=ui('compose','');const slash=text.startsWith('/')?QUICK.filter(q=>('/'+q.s).startsWith(text.toLowerCase())):null;
  const locked=c.closed;
  const handoff=c.ai==='pause'?`<div class="handoff">${ic('hand','m')}<span class="grow">La IA pasó este chat a una persona.</span><button data-act="takeChat" ${P({c:c.id})}>Tomar chat</button></div>`:'';
  return `<header class="chead">${ib('arrow-left','data-back','Atrás')}<button class="who" data-go="INB-19" ${P({id:c.id})} aria-label="Detalles de ${esc(c.name)}">${c.grp?`<span class="av md grp">${ic('users','m')}</span>`:avatar(c.name,'md',c.ai==='on'?'on':c.ai)}<span style="min-width:0"><span class="nm" style="display:block">${esc(c.name)}</span><span class="sb">${sub}</span></span></button>${ib('phone','data-toast="Abre el marcador del teléfono (acción nativa, simulada)"','Llamar')}${ib('ellipsis-vertical','data-sheet="INB-12" '+P({id:c.id}),'Opciones del chat')}</header>
  <div class="thread" data-sk="th">${msgs.map(m=>bubble(m,c)).join('')}${S.ui['prevthink_'+c.id]?'':''}</div>${handoff}
  ${locked?`<div class="comp locked"><div class="lockmsg">${ic('clock-3','m')}<span>La ventana de 24 horas está cerrada. Solo puedes enviar una plantilla aprobada.</span></div><button class="btn p block" data-sheet="INB-17" ${P({id:c.id})}>${ic('file-text','m')}Enviar plantilla</button></div>`
  :`<div class="comp">${slash&&slash.length?`<div class="slashbar">${slash.map(q=>`<button class="item" data-act="quick" ${P({s:q.s})}>${ic('zap','i')}<span class="grow"><span>/${esc(q.s)}</span><small>${esc(q.t)}</small></span></button>`).join('')}</div>`:''}
  <div class="box">${ib('smile','data-sheet="INB-16"','Emojis')}<input data-in="compose" data-enter="send" ${P({id:c.id})} value="${esc(text)}" placeholder="Mensaje" aria-label="Mensaje" autocomplete="off">${text?ib('wand-sparkles','data-sheet="INB-18" '+P({id:c.id}),'Asistente de redacción'):ib('zap','data-sheet="INB-14" '+P({id:c.id}),'Respuestas rápidas')}${ib('paperclip','data-sheet="INB-13" '+P({id:c.id}),'Adjuntar')}</div><button class="send" data-act="send" aria-label="Enviar" style="${text?'':'opacity:.5'}">${ic('send')}</button></div>`}`;
}

  const aiL={on:'Atiende la IA',pause:'En pausa',off:'Apagada'}[c.ai];

  <div style="display:flex;flex-direction:column;align-items:center;padding:6px 16px 16px;gap:6px">${c.grp?`<span class="av xl grp">${ic('users','xl')}</span>`:avatar(c.name,'xl')}<div style="font-size:20px;font-weight:600">${esc(c.name)}</div><div class="coin">${esc(c.phone||'Grupo de WhatsApp')} · ${esc(c.win)}</div></div>
  ${c.src?`<div class="card pad" style="display:flex;gap:10px;align-items:center">${ic('target','i')}<div><b style="font-size:13px;display:block">Llegó por anuncio</b><span class="coin">${esc(c.src)}</span></div></div>`:''}
  <div class="card">${item('git-branch','Etapa',{a:`data-sheet="INB-21" ${P({c:c.id})}`,end:c.stage?`<span class="dot" style="background:${stageById(c.stage).col}"></span>${stageById(c.stage).n}`:'—',chev:1})}<div class="sep full"></div>${item('user-check','Asignado',{a:`data-sheet="INB-22" ${P({c:c.id})}`,end:esc(a),chev:1})}<div class="sep full"></div>${item('tag','Etiquetas',{a:`data-sheet="INB-23" ${P({c:c.id})}`,end:c.tags.length?c.tags.length+' etiqueta'+(c.tags.length>1?'s':''):'Sin etiquetas',chev:1})}</div>
  ${c.tags.length?`<div class="pills" style="padding:0 18px 12px">${c.tags.map(tagCap).join('')}</div>`:''}

/* ---- src/screens-crm.js ---- */
const money=s=>{const n=parseInt(String(s).replace(/[^0-9]/g,''),10);return isNaN(n)?0:n};
const fmt=n=>'$'+n.toLocaleString('en-US');
const crmSeg=cur=>seg([{k:'p',l:'Pipeline'},{k:'c',l:'Contactos'},{k:'b',l:'Biblioteca'}],cur,i=>`data-go="${{p:'CRM-01',c:'CRM-10',b:'CRM-40'}[i.k]}"`);

/* ===== PIPELINE ===== */
function pipelineScreen(){
  const who=ui('pf_who','all'),q=ui('pq','').toLowerCase();
  const leads=LEADS.filter(l=>(who==='all'||(who==='none'?!l.as:l.as===who))&&(!q||l.name.toLowerCase().includes(q)));
  const open=leads.filter(l=>l.stage!=='cli'&&l.stage!=='per');
  const sum=open.reduce((a,l)=>a+money(l.amount),0);
  const cur=Math.min(+ui('pcol',0),STAGES.length-1);
  const cols=STAGES.map(s=>{const L=leads.filter(l=>l.stage===s.id);const tot=L.reduce((a,l)=>a+money(l.amount),0);
    return `<section class="col" aria-label="${s.n}"><div class="col-h"><span class="dot" style="background:${s.col};width:10px;height:10px"></span>${s.n}<small>${L.length} · ${fmt(tot)}</small></div>${L.map(l=>`<button class="lead" data-sheet="CRM-02" ${P({l:l.id})}><span class="t">${avatar(l.name,'sm')}<b style="flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.name)}</b><span class="amt">${esc(l.amount)}</span></span><span class="meta">${l.tags.map(tagCap).join('')}${l.as?`<span>${ic('user-round','s')} ${esc(userById(l.as).n.split(' ')[0])}</span>`:'<span>Sin asignar</span>'}${l.prio&&l.prio!=='Sin prioridad'?`<span class="cap2" style="background:${l.prio==='Alta'?'var(--danger-tint)':'var(--surface-sunken)'};color:${l.prio==='Alta'?'var(--danger-text)':'var(--text-2)'}">${l.prio}</span>`:''}</span></button>`).join('')||`<div class="desc" style="text-align:center;padding:24px 0">Sin tratos en esta etapa</div>`}</section>`}).join('');
  return `<header class="appbar"><h1>CRM</h1>${ib('search','data-sheet="CRM-08"','Buscar lead')}${ib('ellipsis-vertical','data-sheet="CRM-09"','Más opciones')}</header>${crmSeg('p')}
  <div class="kpis" style="grid-template-columns:1fr 1fr 1fr;padding-bottom:6px;gap:8px"><div class="kpi" style="padding:9px 11px"><small>Abiertos</small><b style="font-size:17px">${open.length}</b></div><div class="kpi" style="padding:9px 11px"><small>En juego</small><b style="font-size:17px">${fmt(sum)}</b></div><div class="kpi" style="padding:9px 11px"><small>Ganados</small><b style="font-size:17px">${leads.filter(l=>l.stage==='cli').length}</b></div></div>
  <div class="stage-strip">${STAGES.map((s,i)=>`<i class="${i===cur?'on':''}"></i>`).join('')}</div>
  ${V({ok:`<div class="cols" data-sk="cols" id="cols">${cols}</div>`,loading:`<div style="padding:8px 16px">${skelCards(3)}</div>`,empty:emptyS('kanban','Tu pipeline está vacío','Los leads nacen solos cuando un cliente escribe, o puedes crear uno.')})}
  <button class="fab" data-sheet="CRM-06" aria-label="Nuevo lead">${ic('plus')}</button>`;
}

const CTS=()=>CONTACTS.filter(c=>!CONVS.find(x=>x.id===c.id).grp);
function contactsScreen(){
  const f=ui('cf','all'),q=ui('cq','').toLowerCase(),sel=ui('csel',[]),sm=ui('cselMode',false);
  let l=CTS().filter(c=>(f==='all'||c.consent===f)&&(!q||(c.name+c.phone).toLowerCase().includes(q)));
  const head=sm?`<header class="appbar sub">${ib('x','data-set="cselMode="','Cancelar')}<h2>${sel.length} seleccionados</h2>${ib('tag','data-sheet="CRM-15"','Etiquetar')}${ib('download','data-sheet="CRM-15"','Exportar')}</header>`:`<header class="appbar"><h1>CRM</h1>${ib('square-check-big','data-flip="cselMode"','Seleccionar')}${ib('ellipsis-vertical','data-sheet="CRM-16"','Más opciones')}</header>`;
  return `${head}${sm?'':crmSeg('c')}${searchBox('cq','Buscar nombre o teléfono')}${chips([{k:'all',l:'Todas'},{k:'Opt-in',l:'Opt-in'},{k:'Sin respuesta',l:'Sin respuesta'},{k:'Baja',l:'Baja'}],f,'cf').replace('</div>',`<button class="chip" data-sheet="CRM-14">${ic('sliders-horizontal','s')}Filtros</button></div>`)}
  <div class="scroll pad-tab" data-sk="cts">${V({ok:l.length?l.map(c=>`<button class="row ${sel.includes(c.id)?'sel':''}" ${sm?`data-act="csel" ${P({c:c.id})}`:`data-go="CRM-11" ${P({id:c.id})}`}>${sm?`<span class="chk r ${sel.includes(c.id)?'on':''}">${ic('check','s')}</span>`:''}${avatar(c.name,'md')}<span class="body"><span class="l1"><span class="name">${esc(c.name)}</span>${c.consent==='Baja'?'<span class="status-pill err">Baja</span>':''}</span><span class="l2"><span class="prev">${esc(c.phone)}</span></span><span class="l3">${c.stage?stageCap(c.stage):''}${tagsCaps(c.tags,1)}${c.as?`<span class="coin">${esc(userById(c.as).n.split(' ')[0])}</span>`:''}</span></span></button>`).join('')+`<div class="desc" style="text-align:center;padding:14px">Mostrando ${l.length} de ${CTS().length} contactos</div>`:emptyS('search','Sin resultados','Prueba con otro nombre o quita los filtros.'),empty:emptyS('users','Sin contactos','Importa una base o agrega tu primer contacto.','<button class="btn p" data-sheet="CRM-12">Nuevo contacto</button>'),loading:skel(7)})}</div>${sm?'':`<button class="fab" data-sheet="CRM-12" aria-label="Nuevo contacto">${ic('user-plus')}</button>`}`;
}

def('CRM-23',{title:'Mover cita',kind:'sheet',parent:'CRM-21',p:{id:'b4'},web:'/bookings (Mover a)',note:'Solo muestra días con huecos y horarios libres.',render(){return sheet('Mover a',`<div class="desc">Días con huecos</div><div class="cal-days">${[['M',10],['M',11],['V',13]].map((x,i)=>`<button class="${i===0?'on':''}">${x[0]}<b>${x[1]}</b></button>`).join('')}</div><div class="desc">Horarios libres</div><div class="chips" style="flex-wrap:wrap">${['9:00','10:30','12:00','17:00'].map((h,i)=>`<button class="chip ${i===1?'on':''}">${h}</button>`).join('')}</div>`,{foot:'<button class="btn p" data-act="done" '+P({m:'Cita movida (simulado)'})+'>Confirmar</button>'})}});

def('CRM-30',{title:'Tareas',tab:'more',parent:'MORE-01',web:'/trabajo/tareas',status:'adaptada',note:'Cada quien ve lo suyo; Propietario y Coordinador ven todo (work.manage). Toca para ver el detalle.',render(){
  const f=ui('tf','mine');const l=TASKS0.filter(t=>f==='all'||t.who===ME);const pend=l.filter(t=>!t.done),done=l.filter(t=>t.done);
  const row=t=>`<div class="task ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" data-act="toggleTask" ${P({id:t.id})} aria-label="Marcar tarea">${ic('check','s')}</button><button class="grow" style="text-align:left" data-sheet="CRM-31" ${P({id:t.id})}><div class="tt">${esc(t.t)}</div><small class="${t.late&&!t.done?'late':''}">${ic('clock-3','s')}${esc(t.due)}${t.cid?` · ${ic('user-round','s')}${esc(t.cid)}`:''}${S.role!=='asesor'&&f==='all'?` · ${esc(userById(t.who).n.split(' ')[0])}`:''}</small></button></div>`;
  return `${bar('Tareas y notas')}${workSeg('t')}${S.role!=='asesor'?chips([{k:'mine',l:'Mis tareas'},{k:'all',l:'Todo el equipo'}],f,'tf'):''}<div class="scroll" data-sk="tk">${V({ok:`<div class="field" style="margin:6px 16px 8px"><input class="inp" data-in="newtask" data-enter="addTask" value="${esc(ui('newtask',''))}" placeholder="Agregar tarea y presionar Enter…" aria-label="Agregar tarea"></div>${pend.map(row).join('')||emptyS('list-checks','Todo al día','No tienes tareas pendientes.')}${done.length?group('Hechas')+done.map(row).join(''):''}`,loading:skel(4),empty:emptyS('list-checks','Sin tareas','Crea la primera con el campo de arriba.')})}</div>`}});
def('CRM-31',{title:'Detalle de la tarea',kind:'sheet',parent:'CRM-30',p:{id:'k1'},web:'/trabajo/tareas (detalle)',note:'Título, notas, fecha y hora, responsable y contacto ligado.',render(p){const t=TASKS0.find(x=>x.id===p.id)||TASKS0[0];
  return sheet('Detalle de la tarea',`${field('Título','tt',{val:t.t})}${field('Notas o detalles (opcional)','tn',{area:1,val:''})}${pick('Fecha límite',t.due,'data-toast="Selector de fecha nativo (simulado)"')}${pick('Responsable',userById(t.who).n,'data-toast="Se elige entre el equipo (simulado)"')}${pick('Contacto',t.cid||'Sin contacto','data-sheet="INB-10"')}`,{foot:'<button class="btn dd" data-act="done" '+P({m:'Tarea borrada (simulado)'})+'>Borrar</button><button class="btn p" data-act="done" '+P({m:'Tarea guardada (simulado)'})+'>Guardar</button>'})}});
def('CRM-32',{title:'Notas',tab:'more',parent:'MORE-01',web:'/trabajo/notas',status:'adaptada',note:'Notas tipo Keep: fijadas arriba, color, ligadas o no a un chat. Internas: nunca se envían.',render(){
  const pin=NOTES0.filter(n=>n.pin),oth=NOTES0.filter(n=>!n.pin);const card=n=>`<button class="note ${n.c}" data-sheet="CRM-33" ${P({id:n.id})}>${n.t?`<b>${esc(n.t)}</b>`:''}${esc(n.b).replace(/\n/g,'<br>')}${n.chat?`<small>${ic('message-circle','s')} ${esc(n.chat)}</small>`:''}</button>`;

def('CRM-33',{title:'Editor de nota',kind:'sheet',size:'tall',parent:'CRM-32',p:{id:'n1'},web:'/trabajo/notas (detalle)',note:'Título opcional, color, fijar y ligar a un chat (solo lo ve quien ve ese contacto).',render(p){const n=NOTES0.find(x=>x.id===p.id)||NOTES0[0];
  return sheet('Nota',`${field('Título (opcional)','nt',{val:n.t})}${field('Escribe una nota…','nb',{area:1,val:n.b})}<div class="group-h">Color</div><div style="display:flex;gap:12px;padding:4px 18px 12px">${['#fff3c4','#def3e3','#e2ebff','#f0f0f3'].map(c=>`<button class="ib" style="width:44px;height:44px;background:${c};border:1px solid var(--border-strong)" data-toast="Color elegido (simulado)" aria-label="Color"></button>`).join('')}</div>${swItem('Fijar arriba','npin',!!n.pin)}${pick('Chat ligado',n.chat||'Ninguno','data-sheet="INB-10"')}`,{foot:'<button class="btn dd" data-act="done" '+P({m:'Nota borrada (simulado)'})+'>Borrar</button><button class="btn p" data-act="done" '+P({m:'Nota guardada (simulado)'})+'>Guardar</button>'})}});

def('CRM-41',{title:'Entrada de la Biblioteca',tab:'crm',parent:'CRM-40',p:{id:'f1'},web:'/knowledge (editor)',status:'adaptada',note:'Título, contenido o archivo, etiquetas y destinos. Al menos un destino (si no: error). Archivos: PDF, Word, texto, imagen, hasta 100 MB.',render(p){const x=LIB.find(y=>y.id===p.id)||LIB[0];const chat=ui('dchat',x.chat),rag=ui('drag',x.rag);const bad=!chat&&!rag;

def('CRM-42',{title:'Menú ⋮ de Biblioteca',kind:'menu',parent:'CRM-40',web:'/knowledge (menú)',status:'adaptada',render(){return menuRow('folder-plus','Nueva carpeta','data-toast="Carpeta creada (simulado)"')+menuRow('tag','Filtrar por etiqueta','data-toast="Filtro por etiqueta (simulado)"')+menuRow('plus','Agregar entrada','data-go="CRM-41"')}});

const stPill=a=>a.st==='pub'?statusPill('ok','Publicado','circle-check'):statusPill('warn','Borrador','pencil');
def('LAB-01',{title:'Agentes',kind:'root',tab:'lab',web:'/lab',status:'adaptada',note:'Resumen del mes y lista de agentes: general, publicados y borradores. Pausa global y por agente (nunca silencio: el chat pasa a una persona).',render(){
  const paused=ui('pauseAll',false);
  return `<header class="appbar"><h1>Estudio IA</h1>${ib('ellipsis-vertical','data-sheet="LAB-08"','Más opciones')}</header>${labTabs('a')}
  <div class="scroll pad-tab" data-sk="lab">${paused?banner('warn','pause','<b>Todos los agentes en pausa.</b> Los chats nuevos pasan a una persona.','<button data-act="pauseOff">Reanudar</button>'):''}
  ${V({ok:`<div class="kpis" style="padding-top:10px"><div class="kpi"><small>Chats atendidos por IA</small><b>174</b><i class="up">+12 % vs. mes pasado</i></div><div class="kpi"><small>Resueltos sin persona</small><b>78 %</b></div><div class="kpi"><small>Pasados a una persona</small><b>38</b></div><div class="kpi"><small>IA usada este mes</small><b>42 %</b><div class="progress" style="margin-top:6px"><i style="width:42%"></i></div></div></div>
  <button class="card pad" style="width:calc(100% - 32px);text-align:left;background:var(--bubble-ai);border-color:transparent;display:flex;gap:12px;align-items:center" data-go="LAB-02"><span class="ico av md" style="background:var(--surface);color:var(--bubble-ai-who)">${ic('sparkles','m')}</span><span style="flex:1"><b style="color:var(--bubble-ai-text);display:block">Crea tu agente platicando</b><span style="font-size:13px;color:var(--bubble-ai-text);opacity:.8">Cuéntame de tu negocio y yo lo armo.</span></span>${ic('chevron-right','m')}</button>
  ${group('Tus agentes')}${AGENTS.map(a=>`<button class="card" style="width:calc(100% - 32px);text-align:left;display:block" data-go="LAB-03" ${P({id:a.id})}><div class="row" style="padding:12px 14px"><span class="av md" style="background:var(--bubble-ai);color:var(--bubble-ai-who)">${ic('bot','m')}</span><span class="body"><span class="l1"><span class="name">${esc(a.n)}</span>${a.gen?'<span class="status-pill info">General</span>':''}</span><span class="l3" style="margin-top:4px">${stPill(a)}<span class="coin">${a.chats} chats · ${a.res}</span></span></span></div></button>`).join('')}`,empty:emptyS('bot','Aún no tienes agentes','Crea el primero platicando con el asistente.','<button class="btn p" data-go="LAB-02">Empezar</button>'),loading:skelCards(4),error:errorS('No pudimos cargar tus agentes.')})}</div>`}});

def('LAB-02',{title:'Creador de agentes (chat)',tab:'lab',parent:'LAB-01',web:'/lab (agent-creator)',status:'adaptada',note:'Conversación con la IA creadora: describe el negocio y pide ajustes. Genera un BORRADOR; nunca publica solo.',render(){

  return `${bar('Crear agente',{sub:'Conversa con el creador'})}<div class="thread" data-sk="th" style="background:var(--surface)"><div class="b ai" style="max-width:88%"><div class="who">${ic('sparkles','s')}Creador</div>¡Hola! Cuéntame de tu negocio: qué vendes, a quién y cómo te gusta hablar con tus clientes.<span class="m">ahora</span></div>${['Tengo una joyería en CDMX. Vendo mayoreo y menudeo.'].concat(asked).map((t,i)=>`<div class="b out">${esc(t)}<span class="m">ahora</span></div>`).join('')}<div class="b ai" style="max-width:88%"><div class="who">${ic('sparkles','s')}Creador</div>Listo. Preparé un borrador con tono cercano, horario L–V 9–19 y traspaso a una persona si piden descuentos.<div class="prop" style="margin-top:8px"><b style="color:var(--text)">Joyería — ventas</b><div class="coin">Borrador · 3 secciones</div><button class="btn t sm" style="margin-top:8px" data-go="LAB-03" ${P({id:'a3'})}>Ver borrador</button></div><span class="m">ahora</span></div></div><div class="sugg" style="padding-top:8px">${['Hazlo más formal','Agrega horario de sábado','Que pase a persona si piden factura'].map(s=>`<button data-act="done" ${P({m:'Simulado: ajuste pedido al creador'})}>${s}</button>`).join('')}</div><div class="comp" style="background:var(--surface)"><div class="box"><input data-in="crq" data-enter="done" ${P({m:'Simulado: mensaje al creador'})} placeholder="Cuéntame de tu negocio o pide un ajuste…" aria-label="Mensaje para el creador" value="${esc(ui('crq',''))}"></div><button class="send" data-act="done" ${P({m:'Simulado: mensaje al creador'})} aria-label="Enviar">${ic('send')}</button></div>`}});
def('LAB-03',{title:'Editor del agente',tab:'lab',parent:'LAB-01',p:{id:'a1'},web:'/lab/agents/[id]',status:'adaptada',note:'Formulario por secciones; el borrador no afecta a tus clientes hasta «Publicar». Vista previa a un toque.',render(p){

def('AST-01',{title:'Asistente',tab:'more',parent:'MORE-01',web:'/asistente',status:'adaptada',note:'Solo Propietario con módulo Asistente. Lee al momento; todo lo que cambia o envía se PROPONE y corre con «Aplicar». Sin botón flotante en móvil.',render(){
  const asked=ui('asked',[]);const sp=ui('spd','n');const sug=['Audita mis agentes de IA','Revisa los chats que contestó la IA','¿Cuánto vendí este mes?','Etiqueta a quienes pidieron cotización'];
  return `${bar('Asistente',{sub:SPEEDS[sp][0],right:[ib('history','data-sheet="AST-02"','Conversaciones'),ib('ellipsis-vertical','data-sheet="AST-03"','Modo y crédito')]})}<div class="scroll" data-sk="ast" style="display:flex;flex-direction:column">${asked.length?'':`<div class="empty" style="padding-bottom:6px"><div class="ill" style="background:var(--bubble-ai);color:var(--bubble-ai-who)">${ic('sparkles','xl')}</div><h3>¿En qué te ayudo?</h3><p>Pregunta lo que quieras sobre tu negocio. Para cambiar algo, te lo propongo y tú aplicas.</p></div><div class="sugg">${sug.map(s=>`<button data-act="ask" ${P({q:s})}>${esc(s)}</button>`).join('')}</div>`}
  ${asked.map((q,i)=>`<div class="astmsg u">${esc(q)}</div><div class="astmsg a">${i===asked.length-1&&ui('thinking',false)?`<span class="coin">${ic('refresh-cw','s')} Revisando tus datos…</span>`:`${/etiquet/i.test(q)?`Encontré <b>12 chats</b> que pidieron cotización. Propongo etiquetarlos como «Seguimiento».<div class="prop"><b>Etiquetar 12 contactos · «Seguimiento»</b><div class="coin">Karla Méndez, Luis Ramírez y 10 más</div>${ui('applied_'+i)?`<div style="margin-top:8px">${statusPill('ok','Hecho','check')}</div>`:`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn p sm" data-act="apply" ${P({k:i})}>Aplicar</button><button class="btn s sm" data-toast="Propuesta descartada">Descartar</button></div>`}</div>`:`Este mes llevas <b>9 tratos ganados</b> por <b>$26,200</b>, 18 % más que el mes pasado. El 78 % de los chats los resolvió la IA sin persona.`}<div class="src">${ic('database','s')}Datos de: pipeline, analítica de ventas</div>`}</div>`).join('')}</div>
  <div class="comp" style="background:var(--surface)"><div class="box"><input data-in="ask" data-enter="ask" value="${esc(ui('ask',''))}" placeholder="Pregunta lo que quieras" aria-label="Tu pregunta"></div><button class="send" data-act="ask" aria-label="Enviar">${ic('send')}</button></div>`}});
def('AST-02',{title:'Conversaciones del asistente',kind:'sheet',parent:'AST-01',web:'/asistente (hilos)',note:'Chat general fijo + hilos archivables. Cada hilo es de quien lo abre; se conserva 90 días.',render(){return sheet('Conversaciones',`<button class="item" data-close><span class="ico">${ic('sparkles','m')}</span><span class="grow"><span>Chat general</span><small>Fijo</small></span></button>${['Auditoría de agentes','Campaña de diciembre'].map(t=>`<button class="item" data-close>${ic('message-square','i')}<span class="grow"><span>${t}</span><small>Hace 2 días</small></span><button class="ib" data-toast="Hilo archivado (simulado)" aria-label="Archivar">${ic('archive','m')}</button></button>`).join('')}<div style="padding:10px 16px"><button class="btn t block" data-act="done" ${P({m:'Hilo nuevo (simulado)'})}>${ic('plus','m')}Hilo nuevo</button></div>`)}});
def('AST-03',{title:'Modo y crédito',kind:'sheet',parent:'AST-01',web:'/asistente (speed-picker, crédito)',note:'Rápido/Normal/Profundo = esfuerzo bajo/medio/alto. El consumo se muestra en porcentaje, nunca en dólares.',render(){const sp=ui('spd','n');
  return sheet('Modo y crédito',`${Object.entries(SPEEDS).map(([k,v])=>opt(v[0],sp===k,`data-set="spd=${k}"`,{radio:1,sub:v[1]})).join('')}${group('Crédito del asistente')}<div style="padding:0 18px 14px"><div class="progress"><i style="width:34%"></i></div><div class="coin" style="margin-top:6px">34 % usado este mes</div></div>${group('Avance')}<div class="desc">Aquí verás de qué consultas sale cada respuesta.</div>`)}});
def('AST-04',{title:'Asistente · sin crédito',tab:'more',parent:'MORE-01',web:'/asistente (sin tope)',note:'Sin tope propio configurado el asistente no responde: se explica y se enlaza a Uso y plan.',render(){return `${bar('Asistente')}<div class="scroll">${emptyS('gauge','El asistente alcanzó su tope','Se renueva el 1 de diciembre. Puedes pedir más crédito en Mejora tu plan.','<button class="btn p" data-go="MORE-07">Mejora tu plan</button>')}</div>`}});

/* ===== USO Y PLAN ===== */
const meter=(l,pct,sub,warn)=>`<div class="card pad"><div style="display:flex;justify-content:space-between;font-size:14.5px;font-weight:500"><span>${l}</span><span>${pct} %</span></div><div class="progress ${warn?'warn':''}" style="margin:8px 0 4px"><i style="width:${pct}%"></i></div><div class="coin">${sub}</div></div>`;
def('MORE-06',{title:'Uso y plan',tab:'more',parent:'MORE-01',web:'(ventana Uso y plan)',status:'adaptada',note:'Tu consumo del mes contra tus topes. Solo Propietario (usage.read). Sin costos ni precios por modelo. La ventana centrada de la web pasa a pantalla completa.',render(){
  return `${bar('Uso y plan',{sub:'Plan Pro · noviembre'})}<div class="scroll" data-sk="uso">${V({ok:`${banner('warn','gauge','Llevas <b>80 %</b> de tu IA del mes. Al 100 % la IA se pausa.','<button data-go="MORE-07">Mejorar</button>')}${meter('IA del mes',80,'Agentes 52 % · Creador 8 % · Asistente 20 %',true)}${meter('Almacenamiento (aprox.)',23,'1.1 GB de 5 GB')}${meter('Personas',60,'3 de 5 personas')}${meter('Documentos de la IA',30,'30 de 100')}${group('Por función')}<div class="card pad">${kv('Agentes','52 %')}${kv('Creador','8 %')}${kv('Asistente','20 %')}</div>${group('Por agente')}<div class="card pad">${kv('Ventas — general','40 %')}${kv('Citas y agenda','12 %')}</div><div style="padding:6px 16px 24px"><button class="btn p block" data-go="MORE-07">Mejora tu plan</button></div>`,loading:skelCards(3)})}</div>`}});
def('MORE-07',{title:'Mejora tu plan',tab:'more',parent:'MORE-06',web:'(Mejora tu plan)',status:'adaptada',note:'Catálogo en pesos + IVA. Sin cobro real todavía: «Solicitar» avisa a Demfort (facturación manual).',render(){
  const P2=[['Esencial','$499','Bandeja, CRM, Biblioteca, Resultados',false],['Pro','$899','+ Agentes IA, Agenda, Atribución',true],['Ultra','$1,799','+ Campañas masivas y Asistente interno',false]];
  return `${bar('Mejora tu plan')}<div class="scroll"><div class="desc">Precios por mes + IVA. Pago anual: paga 10 meses, usa 12.</div>${P2.map(p=>`<div class="card pad" style="${p[3]?'border-color:var(--accent);border-width:2px':''}"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:17px">${p[0]}</b>${p[3]?statusPill('ok','Tu plan'):''}<span style="margin-left:auto;font-size:20px;font-weight:600">${p[1]}</span></div><div class="coin" style="margin:6px 0 10px">${p[2]}</div>${p[3]?'':`<button class="btn ${p[0]==='Ultra'?'p':'t'} block" data-sheet="MORE-09">Solicitar ${p[0]}</button>`}</div>`).join('')}</div>`}});
def('MORE-09',{title:'Solicitar cambio de plan',kind:'modal',parent:'MORE-07',web:'POST /api/usage/plan-request',render(){return `<h3>Solicitar plan Ultra</h3><p>Avisaremos a Demfort y te escribirán para confirmar el cambio y la factura. No se hace ningún cobro ahora.</p><div class="acts"><button class="btn s" data-close>Cancelar</button><button class="btn p" data-act="done" ${P({m:'Solicitud enviada (simulado)'})}>Solicitar</button></div>`}});
def('MORE-10',{title:'Aviso «a este ritmo»',kind:'modal',parent:'MORE-01',web:'(usage-prompt)',status:'adaptada',note:'Una vez por semana si el ritmo alcanza el tope antes de fin de mes; «Recordármelo» pospone 3 días.',render(){return `<h3>Vas a este ritmo</h3><p>Con tu consumo actual, tu IA del mes se agotará hacia el día <b>24</b>.</p><div class="acts col"><button class="btn p" data-go="MORE-07">Ver planes</button><button class="btn g" data-close>Recordármelo en 3 días</button></div>`}});

/* ===== AJUSTES (Propietario y Coordinador; cada pestaña con su permiso) ===== */
const SET_ITEMS=[
  ['Negocio',[['message-circle','Canales y conexiones','SET-02','WhatsApp, plantillas, conexión'],['users','Equipo y permisos','SET-03','Miembros y roles'],['target','Anuncios (Meta)','SET-04','CAPI y atribución'],['wallet','Uso y plan','MORE-06','Consumo y plan']]],
  ['Atención y ventas',[['tag','Etiquetas','SET-05',''],['zap','Respuestas rápidas','SET-06','Atajos con /'],['x','Motivos de pérdida','SET-07',''],['calendar-days','Agenda y conectores','SET-08','Zoom, Meet'],['message-square','Chat de equipo','SET-09','Grupos y supervisión'],['shield','Bajas automáticas','SET-10','STOP / BAJA']]],
  ['IA conectada',[['plug','Mi IA','SET-11','Conecta tu Claude o ChatGPT'],['sliders-horizontal','Conector del equipo','SET-12','Solo Propietario']]],
  ['Personal',[['smartphone','Mi número','SET-13','WhatsApp personal'],['bell','Notificaciones','SET-14','Sonido y avisos'],['palette','Apariencia','SET-15','Tema, letra, chat'],['building-2','Marca','SET-16','Nombre, logo y color'],['layout-dashboard','Navegación','SET-17','Menú por rol']]]
];
def('SET-01',{title:'Ajustes',tab:'more',parent:'MORE-01',web:'/settings',status:'adaptada',note:'Lista de secciones en 4 grupos con «Buscar un ajuste». Cada sección es su propia pantalla; lo que tu rol no puede abrir no aparece.',render(){
  const q=ui('sq','').toLowerCase();const o=S.role==='owner';
  const groups=SET_ITEMS.map(([g,it])=>[g,it.filter(i=>(!q||(i[1]+i[3]).toLowerCase().includes(q))&&(S.role!=='coord'||!['Conector del equipo','Uso y plan'].includes(i[1])))]).filter(g=>g[1].length);
  return `${bar('Ajustes')}${searchBox('sq','Buscar un ajuste')}<div class="scroll" data-sk="set">${groups.map(([g,it])=>group(g)+it.map(i=>`<button class="item" data-go="${i[2]}"><span class="ico">${ic(i[0],'m')}</span><span class="grow"><span>${i[1]}</span>${i[3]?`<small>${i[3]}</small>`:''}</span>${ic('chevron-right','m')}</button>`).join('')).join('')||emptyS('search','Sin resultados','Prueba con otra palabra: etiquetas, plantillas, equipo…')}</div>`}});
const setPage=(title,body,o={})=>`${bar(title,o)}<div class="scroll" data-sk="sp">${body}</div>`;
/* canales */
def('SET-02',{title:'Canales y conexiones',tab:'more',parent:'SET-01',web:'/settings/whatsapp',status:'adaptada',note:'Estado del número de WhatsApp, calidad, límite y uso (salud del número). Conectar con Facebook (Embedded Signup) abre el flujo de Meta.',render(){
  const ok=S.mode!=='error';
  return setPage('Canales y conexiones',`${tabsU([{k:'w',l:'WhatsApp',a:''},{k:'t',l:'Plantillas',a:'data-go="MKT-20"'},{k:'d',l:'Conexión directa',a:'data-go="SET-02C"'}],'w')}${ok?banner('ok','circle-check','<b>Conectado.</b> +52 55 5550 0100 · Joyería Cristal'):banner('err','wifi-off','<b>Conexión incompleta.</b> Falta el permiso de mensajes. Reconecta con Facebook.','<button data-sheet="SET-02A">Reconectar</button>')}<div class="card">${item('activity','Salud del número',{a:'data-sheet="SET-02B"',end:statusPill('ok','Calidad alta'),chev:1})}</div><div class="card pad">${kv('Límite diario','1,000 conversaciones')}${kv('Uso de hoy','186')}${kv('Webhook','Recibiendo')}</div><div style="padding:0 16px 20px;display:flex;flex-direction:column;gap:10px"><button class="btn t block" data-sheet="SET-02A">Conectar con Facebook</button><button class="btn s block" data-toast="Desconectar: pide confirmación (simulado)">Desconectar</button></div>`)}});
def('SET-02A',{title:'Conectar con Facebook',kind:'sheet',parent:'SET-02',web:'/settings/whatsapp (embedded-signup)',note:'Tech Provider: abre el flujo de Meta en el navegador del sistema y regresa a la app. También existe la conexión manual con token (solo web).',render(){return sheet('Conectar WhatsApp',`${banner('info','info','Se abre el inicio de sesión de Meta. Al terminar regresas aquí.')}<div style="padding:0 16px 8px"><button class="btn p block" data-url="meta">${ic('globe','m')}Continuar con Facebook</button></div>${menuRow('key-round','Conexión manual (token) · solo en la web','data-toast="Se hace en la versión web"')}`)}});
def('SET-02B',{title:'Salud del número',kind:'sheet',parent:'SET-02',web:'/settings/whatsapp (number-health)',note:'Calidad, límite de mensajes, uso y alertas de Meta.',render(){return sheet('Salud del número',`<div class="card pad">${kv('Calidad',statusPill('ok','Alta'))}${kv('Nivel de mensajes','1,000 por día')}${kv('Usados hoy','186 (19 %)')}</div><div class="progress" style="margin:0 18px 14px"><i style="width:19%"></i></div>${banner('info','bell','Si la calidad baja a «Media» o «Baja», recibirás un aviso.')}`)}});
def('SET-02C',{title:'Conexión directa',tab:'more',parent:'SET-02',web:'/settings/direct-connection',status:'adaptada',note:'Complemento OCULTO: solo aparece si la plataforma lo enciende. Es el modo para chats NUEVOS; cada chat se cambia en INB-30 y «Aplicar a todos» cambia todos. Modos Meta / Conexión directa / Híbrida. Texto discreto; nunca «no oficial».',render(){const m=ui('dm','meta');
  return setPage('Conexión directa',`<div class="desc">Complemento activado por tu administrador.</div>${[['meta','Meta','Solo la API oficial de WhatsApp.'],['directa','Conexión directa','Mensajes de texto desde un dispositivo vinculado.'],['mixta','Conexión híbrida','Automática según el mensaje.']].map(([k,l,s])=>opt(l,m===k,`data-set="dm=${k}"`,{radio:1,sub:s})).join('')}${m!=='meta'?`<div class="card">${item('users','Aplicar a todos los chats',{a:'data-toast="Se pediría confirmación y cambia todos los chats de WhatsApp (simulado)"',end:'',chev:1})}${item('qr-code','Vincular dispositivo',{a:'data-sheet="SET-13A"',chev:1})}${item('timer','Límites de envío',{a:'data-toast="Pausas y topes por minuto (simulado)"',chev:1})}</div>`:''}`)}});
/* equipo */
def('SET-03',{title:'Equipo y permisos',tab:'more',parent:'SET-01',web:'/settings/team',status:'adaptada',note:'Miembros y roles (Propietario / Coordinador / Asesor). Invitar genera un enlace de un solo uso. Solo quien puede gestionar usuarios (users.manage).',render(){
  return setPage('Equipo y permisos',`${V({ok:TEAM.map(u=>`<button class="row" data-sheet="SET-03B" ${P({id:u.id})}>${avatar(u.n,'md')}<span class="body"><span class="name" style="display:block">${esc(u.n)}</span><span class="coin">${u.role}</span></span>${u.on?'':statusPill('mute','Pendiente')}${ic('chevron-right','m')}</button>`).join('')+`<div style="padding:14px 16px"><button class="btn p block" data-sheet="SET-03A">${ic('user-plus','m')}Invitar persona</button></div>${group('Qué puede cada rol')}<div class="card pad">${kv('Propietario','Todo')}${kv('Coordinador','Todo menos IA y plan')}${kv('Asesor','Solo sus chats y su CRM')}</div>`,loading:skel(4),empty:emptyS('users','Aún eres solo tú','Invita a tu equipo.')})}`)}});
def('SET-03A',{title:'Invitar persona',kind:'sheet',parent:'SET-03',web:'/settings/team (invitar)',note:'Se genera un enlace de activación; el límite del plan se valida.',render(){return sheet('Invitar persona',`${field('Nombre','in',{ph:'Nombre y apellido'})}${field('Correo','ie',{ph:'persona@empresa.mx'})}${pick('Rol','Asesor','data-toast="Coordinador o Asesor (simulado)"')}`,{foot:'<button class="btn s" data-close>Cancelar</button><button class="btn p" data-act="done" '+P({m:'Enlace de invitación creado (simulado)'})+'>Crear enlace</button>'})}});
def('SET-03B',{title:'Persona del equipo',kind:'sheet',parent:'SET-03',p:{id:'u3'},web:'/settings/team (fila)',note:'Cambiar rol, desactivar. Un asesor puede recibir chats nuevos por reparto.',render(p){const u=userById(p.id)||TEAM[2];return sheet(u.n,`${pick('Rol',u.role,'data-toast="Cambiar rol (simulado)"')}${swItem('Recibe chats nuevos','rcn',true,'Reparto automático de leads nuevos.')}${menuRow('lock','Enlace para restablecer contraseña','data-toast="Enlace de un solo uso creado (simulado)"')}${menuRow('ban','Desactivar acceso','data-toast="Se pediría confirmación (simulado)"',true)}`)}});
def('SET-04',{title:'Anuncios (Meta)',tab:'more',parent:'SET-01',web:'/settings/ads',status:'adaptada',note:'Módulo Atribución: reporta Lead/Compra a Meta (CAPI) con el ctwa_clid. Apagado por defecto.',render(){return setPage('Anuncios (Meta)',`${swItem('Reportar eventos a Meta (CAPI)','capi',true,'Lead al abrir chat desde anuncio; Compra al ganar un trato.')}${field('ID de la fuente de datos (Dataset)','ds',{val:'1234567890'})}${field('Token de acceso','tk',{val:'••••••••••••3f9a',hint:'Solo se muestran los últimos 4.'})}<div style="padding:0 16px"><button class="btn p block" data-act="done" ${P({m:'Guardado (simulado)'})}>Guardar</button></div>`)}});
/* etiquetas */
def('SET-05',{title:'Etiquetas',tab:'more',parent:'SET-01',web:'/settings/tags',status:'adaptada',note:'Colores de una paleta cerrada. Las automáticas de importación se muestran aparte y se pueden fusionar.',render(){return setPage('Etiquetas',`${V({ok:TAGS.map(t=>`<button class="row" data-sheet="SET-05A" ${P({id:t.id})}><span class="cap2 tag" style="padding:4px 11px">${esc(t.n)}</span><span class="body"></span><span class="coin">${CONVS.filter(c=>c.tags.includes(t.id)).length*3+2} contactos</span>${ic('chevron-right','m')}</button>`).join('')+group('Automáticas de importación')+`<button class="row" data-toast="Fusionar con otra etiqueta (simulado)"><span class="cap2">Import: clientes nov</span><span class="body"></span><span class="coin">214</span><span class="status-pill info">Fusionar</span></button>`,empty:emptyS('tag','Sin etiquetas','Crea la primera.'),loading:skel(4)})}<div style="padding:14px 16px"><button class="btn t block" data-sheet="SET-05A">${ic('plus','m')}Nueva etiqueta</button></div>`)}});
def('SET-05A',{title:'Editar etiqueta',kind:'sheet',parent:'SET-05',p:{id:'promo'},web:'/settings/tags (editar)',render(p){const t=tagById(p.id)||TAGS[0];return sheet('Etiqueta',`${field('Nombre','tgn',{val:t.n})}<div class="group-h">Color</div><div style="display:flex;gap:12px;padding:4px 18px 14px">${['#8a8f98','#4338ca','#1fb35b','#f59e0b','#d94a4a','#8b5cf6'].map(c=>`<button class="ib" style="width:40px;height:40px;background:${c}" data-toast="Color elegido (simulado)" aria-label="Color"></button>`).join('')}</div>`,{foot:'<button class="btn dd" data-act="done" '+P({m:'Etiqueta borrada (simulado)'})+'>Borrar</button><button class="btn p" data-act="done" '+P({m:'Etiqueta guardada (simulado)'})+'>Guardar</button>'})}});
def('SET-06',{title:'Respuestas rápidas',tab:'more',parent:'SET-01',web:'/settings/quick-replies',status:'adaptada',note:'Atajo único por organización (a–z, 0–9, _ -, hasta 30). {nombre} se rellena con el contacto. Escribir requiere templates.manage.',render(){return setPage('Respuestas rápidas',`${V({ok:QUICK.map(q=>`<button class="item" data-sheet="SET-06A" ${P({s:q.s})}>${ic('zap','i')}<span class="grow"><span>/${q.s}</span><small>${esc(q.t)}</small></span></button>`).join('')+`<div style="padding:14px 16px"><button class="btn t block" data-sheet="SET-06A">${ic('plus','m')}Nueva respuesta</button></div>`,empty:emptyS('zap','Sin respuestas rápidas','Crea atajos como /precio.'),loading:skel(3)})}`)}});
def('SET-06A',{title:'Editar respuesta rápida',kind:'sheet',parent:'SET-06',p:{s:'hola'},web:'/settings/quick-replies (editar)',render(p){const q=QUICK.find(x=>x.s===p.s)||QUICK[0];const bad=S.mode==='error';return sheet('Respuesta rápida',`${field('Atajo','qs',{val:bad?'Hola Mundo':q.s,bad:bad?'Solo minúsculas, números, _ y -.':'',hint:'Se usa escribiendo /'+q.s})}${field('Texto','qt',{area:1,val:q.t,hint:'Usa {nombre} para el nombre del contacto.'})}`,{foot:'<button class="btn s" data-close>Cancelar</button><button class="btn p '+(bad?'off':'')+'" data-act="done" '+P({m:'Guardada (simulado)'})+'>Guardar</button>'})}});
def('SET-07',{title:'Motivos de pérdida',tab:'more',parent:'SET-01',web:'/settings/loss-reasons',status:'adaptada',note:'Editables; quitar = desactivar. «Otro» no se puede quitar.',render(){return setPage('Motivos de pérdida',`${LOSS.map(l=>`<div class="item"><span class="grow"><span>${l}</span></span>${l==='Otro'?`<span class="coin">Fijo</span>`:ib('pencil','data-toast="Renombrar (simulado)"','Renombrar')}</div>`).join('')}<div style="padding:14px 16px"><button class="btn t block" data-toast="Nuevo motivo (simulado)">${ic('plus','m')}Nuevo motivo</button></div>`)}});
