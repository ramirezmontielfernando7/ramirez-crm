name: CI

# Los cuatro gates del proyecto, corridos por una máquina en cada PR.
#
# Existe sobre todo por los PRs de fuera: quien manda uno no tiene la base de
# datos ni el `.env` de nadie, así que hoy la única forma de saber si su cambio
# sirve es que un humano lo clone y lo corra a mano. Con esto, el resultado
# llega pegado al PR y el colaborador lo ve antes que el mantenedor.
on:
  pull_request:
  push:
    branches: [main]

# Tres pushes seguidos a un PR no necesitan tres corridas: manda la última.
# En `main` no se cancela nada — ahí el historial de qué pasó importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Solo lectura: ninguno de estos pasos escribe en el repo, y un PR desde un
# fork ajeno no debe recibir un token que pueda hacerlo.
permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.config.name }} · typecheck · lint · test · build
    runs-on: ubuntu-latest

    # Los módulos opcionales (canales, agenda) se encienden con variables de
    # despliegue, así que el código que viaja en main tiene que servir en las
    # dos configuraciones — y eso no se sabe corriendo solo una.
    #
    # `default` es lo que instala la mayoría: sin canales extra y sin agenda.
    # `completo` es todo encendido. Entre las dos se cubre lo que las banderas
    # prometen: que apagadas no estorban y encendidas funcionan.
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: default
            channels: ""
            agenda: ""
          - name: completo
            channels: "whatsapp,instagram,messenger"
            agenda: "on"

    env:
      CHANNELS: ${{ matrix.config.channels }}
      AGENDA: ${{ matrix.config.agenda }}

    steps:
      - uses: actions/checkout@v7

      # Antes que setup-node, porque su caché necesita pnpm ya instalado.
      # La versión sale de `packageManager` en package.json y no se repite
      # aquí: duplicarla es tenerla desactualizada en uno de los dos lados.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` falla si el lockfile no cuadra con package.json,
      # en vez de resolver otras versiones en silencio y probar algo que nadie
      # va a instalar.
      - name: install
        run: pnpm install --frozen-lockfile

      # Los cuatro corren AUNQUE uno falle. Es a propósito: si se detuviera en
      # el primero, arreglar tres cosas costaría tres vueltas de ida y vuelta a
      # alguien que no puede reproducirlas en su máquina. Una corrida, la lista
      # completa.
      - name: typecheck
        run: pnpm typecheck

      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: test
        if: ${{ !cancelled() }}
        run: pnpm test

      # Va al final porque es el más lento, y porque ya atrapó cosas que los
      # otros tres no ven: Next rechaza exports que no son handlers en un
      # `route.ts`, y eso solo aparece al construir.
      - name: build
        if: ${{ !cancelled() }}
        run: pnpm build

  # Fase 1 multitenant: lo que un mock de SQL no puede demostrar. Migraciones
  # aplicadas DOS veces seguidas (idempotencia) y pruebas de aislamiento
  # entre organizaciones contra un Postgres de verdad. Es rápido, así que
  # corre en cada push como los demás gates.
  db:
    name: postgres · migraciones ×2 · aislamiento
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vocero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vocero_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # PR 3: las pruebas corren con los roles de producción. Migra `postgres`
    # (dueño), la app conecta como `vocero_app` y `vocero_system`, y en modo
    # estricto: una consulta de dominio sin organización hace fallar la prueba.
    env:
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/vocero_test
      DATABASE_URL: postgresql://vocero_app:app-ci-password-0123456789@localhost:5432/vocero_test
      DATABASE_URL_SYSTEM: postgresql://vocero_system:system-ci-password-0123456789@localhost:5432/vocero_test
      VOCERO_APP_DB_PASSWORD: app-ci-password-0123456789
      VOCERO_SYSTEM_DB_PASSWORD: system-ci-password-0123456789
      DB_TENANT_STRICT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migraciones ×2 + pruebas con BD real
        run: pnpm test:db

  # E2E de dos organizaciones contra la app real con los mocks. Es el más
  # lento (build + arranque), así que solo corre en PRs hacia main, no en
  # cada push.
  e2e-multiorg:
    name: e2e · dos organizaciones
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vocero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vocero"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAMPAIGNS: "on"
      AGENDA: "on"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # e2e-plataforma recorre /platform y los enlaces con un navegador real.
      - name: chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: .env de pruebas (mocks, secretos desechables)
        run: |
          {
            echo "APP_BASE_URL=http://localhost:3000"
            # PR 3: roles de producción y modo estricto (ver job db).
            echo "DATABASE_URL_MIGRATE=postgresql://postgres:postgres@localhost:5432/vocero"
            echo "DATABASE_URL=postgresql://vocero_app:app-ci-password-0123456789@localhost:5432/vocero"
            echo "DATABASE_URL_SYSTEM=postgresql://vocero_system:system-ci-password-0123456789@localhost:5432/vocero"
            echo "VOCERO_APP_DB_PASSWORD=app-ci-password-0123456789"
            echo "VOCERO_SYSTEM_DB_PASSWORD=system-ci-password-0123456789"
            echo "DB_TENANT_STRICT=true"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 24)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "META_WEBHOOK_VERIFY_TOKEN=tok_$(openssl rand -hex 12)"
            echo "META_APP_SECRET=$(openssl rand -hex 16)"
            echo "WA_MOCK_ENABLED=true"
            echo "META_GRAPH_BASE_URL=http://localhost:3000/api/dev/wa-mock/graph"
            echo "OPENROUTER_BASE_URL=http://localhost:3000/api/dev/ai-mock"
            # Fase 3: con proveedor "configurado" (el ai-mock) para probar la
            # cuota de IA por organización de punta a punta.
            echo "OPENROUTER_API_TOKEN=sk-mock-ci"
            echo "OPENROUTER_MODEL=mock/modelo"
            echo "BOT_API_KEY=$(openssl rand -hex 20)"
            echo "CAMPAIGNS=on"
            echo "AGENDA=on"
            echo "MEDIA_DIR=./.dev-media"
            # Campañas v2: con App ID se prueba la plantilla con imagen.
            echo "META_APP_ID=1234567890"
          } > .env
      # `next dev` y no `next start`: el build fija NODE_ENV=production y con
      # eso los mocks (wa-mock, ai-mock) responden 404 por diseño.
      # Primera vuelta SIN PLATFORM_ORG_ID: nadie ve el token del webhook y la
      # pantalla avisa que falta configurarla.
      - name: e2e sin PLATFORM_ORG_ID
        run: |
          set -a; . ./.env; set +a
          MIGRATIONS_DIR=drizzle node scripts/migrate.mjs
          setsid node_modules/.bin/next dev -p 3000 > app1.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-multiorg.mjs
          # Se apaga el grupo entero (next dev lanza procesos hijos).
          kill -- -"$(cat app.pid)"; sleep 2
      # Segunda vuelta CON PLATFORM_ORG_ID = la organización que creó la
      # primera: solo esa ve el token; la organización B sigue sin verlo.
      - name: e2e con PLATFORM_ORG_ID
        run: |
          set -a; . ./.env; set +a
          export PLATFORM_ORG_ID=$(psql "$DATABASE_URL_MIGRATE" -Atc "select m.organization_id from member m join \"user\" u on u.id = m.user_id where u.email = 'e2e@vocero.test'")
          echo "PLATFORM_ORG_ID=$PLATFORM_ORG_ID" >> .env
          setsid node_modules/.bin/next dev -p 3000 > app2.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-multiorg.mjs
          # Fase 3, PR 1: credenciales, webhooks sin organización y cuota de IA.
          node --env-file=.env scripts/e2e-credenciales.mjs
          # Fase 3, PR 2: administrador de plataforma, alta y suspensión.
          node --env-file=.env scripts/e2e-plataforma.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # Fase 3, PR 3: módulos por organización. Con su propio `next dev`:
      # detrás de los tres guiones de arriba, el servidor llegaba al tope de
      # memoria y se reiniciaba a mitad del guion (ECONNRESET), como en la
      # tercera y cuarta vuelta.
      - name: e2e de módulos por organización
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app2b.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-modulos.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # Tercera vuelta, con un `next dev` recién arrancado: el servidor de
      # desarrollo acumula memoria al compilar rutas y, al acercarse a su
      # tope, se reinicia solo cortando las peticiones en vuelo (se vio a
      # mitad de e2e-datos-meta). Mismo .env que la segunda vuelta.
      - name: e2e de Campañas v2
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app3.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          # Al arrancar, la sincronización diaria lee la salud del número; el
          # botón «Actualizar» tiene freno de 1 por minuto (e2e-datos-meta lo usa).
          sleep 65
          # Campañas v2, PR 1: datos de Meta (estados, bajas, salud, plantillas).
          node --env-file=.env scripts/e2e-datos-meta.mjs
          # Campañas v2, PR 2: audiencias, asistente, cola por número, pausas.
          node --env-file=.env scripts/e2e-campanas-v2.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # Campañas v2, PR 4: módulos nuevos y navegación personalizable. Con su
      # propio `next dev`: sumado a la segunda vuelta, el servidor llegaba al
      # tope de memoria y se reiniciaba a mitad del guion (mismo motivo que la
      # tercera vuelta).
      - name: e2e de navegación personalizable
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app4.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-navegacion.mjs
          # Fase D: Personalización → Apariencia (letra, chat, dos niveles).
          node --env-file=.env scripts/e2e-apariencia.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # 031: Laboratorio como Centro de Agentes (agentes, vista previa sin
      # efectos, borrador/publicado, evaluación con snapshot y que producción
      # la siga atendiendo el general). Con su propio `next dev` (memoria).
      - name: e2e de agentes
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app5.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-agentes.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # 033, PR 1: «Trabajo» (Citas + Tareas): menú, alta rápida, marcar
      # hecha, tarea desde un chat, permisos y módulos. Con su propio
      # `next dev` (memoria).
      - name: e2e de Trabajo
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app6.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-trabajo.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # «Número no registrado» de la Bandeja: buscar un teléfono nuevo,
      # registrar, abrir chat y enviar plantilla (con el wa-mock).
      - name: e2e de número no registrado
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app7.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-numero-nuevo.mjs
          kill -- -"$(cat app.pid)"; sleep 2
      # 034: cápsulas de la fila, punto de IA, filtro por etiqueta, archivar
      # y eliminar (clic derecho y pulsación larga; Propietario y Asesor).
      - name: e2e de la Bandeja (cápsulas, archivar, eliminar)
        run: |
          set -a; . ./.env; set +a
          setsid node_modules/.bin/next dev -p 3000 > app8.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          node --env-file=.env scripts/e2e-bandeja-capsulas.mjs
      - name: logs de la app
        if: ${{ failure() }}
        run: tail -n 200 app1.log app2.log app2b.log app3.log app4.log app5.log app6.log app7.log app8.log || true
