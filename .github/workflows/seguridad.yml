name: Seguridad

# Revisión automática y gratuita en cada PR y en main:
#  - Gitleaks: busca llaves o contraseñas reales subidas por error.
#  - Trivy: busca librerías con fallas conocidas GRAVES o CRÍTICAS que ya
#    tengan arreglo (lo bajo o sin arreglo no frena nada).
#  - Semgrep (fase 2, 2026-11): revisa el CÓDIGO propio con las reglas
#    públicas de JavaScript/TypeScript; frena solo lo de severidad ERROR
#    (lo demás son sugerencias de estilo). Los mocks de desarrollo no cuentan.
# Corre en paralelo a CI y no lo alarga.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # lunes: fallas nuevas en librerías ya usadas

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks · secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar y correr gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o g.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf g.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v

  trivy:
    name: Trivy · librerías vulnerables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules
          version: v0.69.3

  semgrep:
    name: Semgrep · código
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Instalar y correr semgrep
        env:
          SEMGREP_VERSION: "1.185.0"
        run: |
          pipx install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off --disable-version-check \
            --config p/javascript --config p/typescript \
            --severity ERROR --error \
            --exclude src/server/dev --exclude src/app/api/dev \
            src
