name: Imagen

# La imagen Docker de la instancia.
#
# - En cada PR y en cada push a main se CONSTRUYE sin publicar. Atrapa lo que
#   `pnpm build` no ve: el Dockerfile, el entrypoint y la etapa runner. Hasta
#   ahora el CI nunca construía la imagen, y el primero en enterarse de un
#   Dockerfile roto era quien desplegaba.
# - Al crear un tag `vX.Y.Z` se PUBLICA en GitHub Container Registry:
#   ghcr.io/kevinrivm/vocero-crm:X.Y.Z (y X.Y, y `latest` si no es
#   prerelease). Es lo que instala el starter: Coolify descarga la imagen en
#   vez de construirla en el VPS (minutos de build y RAM que un VPS chico no
#   tiene).
#
# El commit se hornea como build arg (SOURCE_COMMIT): es lo que hace que
# /api/health diga `commitVerified: true`.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Tres pushes seguidos a un PR no necesitan tres builds: manda el último. En
# main y en los tags no se cancela nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Solo se usa al publicar (tags). En un PR desde un fork GitHub lo baja a
  # lectura por su cuenta.
  packages: write

jobs:
  # Operación 1 (spec 043): la SEÑAL llega a Node dentro de la imagen real.
  # `docker stop` manda SIGTERM al PID 1 (tini), tini la reenvía a Node y la
  # app sale sola con 0, en menos de su tope (25 s), sin llegar al SIGKILL.
  # Antes el PID 1 era la shell de `sh -c` y la señal se perdía.
  apagado:
    name: docker stop → apagado limpio (tini + Node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vocero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vocero"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vocero:apagado
          cache-from: type=gha

      - name: arrancar, comprobar PID 1 y detener con docker stop
        run: |
          docker run -d --name app --network host \
            -e APP_BASE_URL=http://localhost:3000 \
            -e DATABASE_URL_MIGRATE=postgresql://postgres:postgres@localhost:5432/vocero \
            -e DATABASE_URL=postgresql://vocero_app:app-ci-password-0123456789@localhost:5432/vocero \
            -e DATABASE_URL_SYSTEM=postgresql://vocero_system:system-ci-password-0123456789@localhost:5432/vocero \
            -e VOCERO_APP_DB_PASSWORD=app-ci-password-0123456789 \
            -e VOCERO_SYSTEM_DB_PASSWORD=system-ci-password-0123456789 \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 24)" \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e META_WEBHOOK_VERIFY_TOKEN="tok_$(openssl rand -hex 12)" \
            -e META_APP_SECRET="$(openssl rand -hex 16)" \
            vocero:apagado
          for i in $(seq 1 120); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:3000/api/health
          echo; docker exec app ps -o pid,ppid,args | tee ps.txt
          # PID 1 = tini; Node es su hijo directo (PPID 1): le llega la señal.
          # Next cambia el nombre del proceso a «next-server (v…)».
          grep -E '^ *1 +0 +/sbin/tini' ps.txt
          grep -E '^ *[0-9]+ +1 +(next-server|node server\.js)' ps.txt
          inicio=$(date +%s)
          docker stop -t 30 app
          dur=$(( $(date +%s) - inicio ))
          echo "docker stop tardó ${dur} s"
          docker logs app 2>&1 | tail -n 20
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = 0
          test "$dur" -lt 26
          docker logs app 2>&1 | grep -q "apagado limpio terminado"

  imagen:
    name: docker build${{ startsWith(github.ref, 'refs/tags/v') && ' · publicar' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GHCR (solo al publicar)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha

      # Solo amd64 por ahora: es lo que corren los VPS de la guía. arm64
      # (Oracle, Ampere) emulado con QEMU multiplica el tiempo del build; se
      # agrega cuando haya quien lo instale.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Operación 1: los guiones de respaldo DENTRO de la imagen, contra el mismo
  # Postgres que producción (18). Atrapa lo que ningún test unitario ve: que
  # falte pg_dump, que sea de una versión menor que el servidor, o que la
  # restauración de prueba no funcione con la base real migrada.
  respaldos:
    name: respaldo + prueba de restauración (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vocero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vocero"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB: postgresql://postgres:postgres@localhost:5432/vocero
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vocero:ci
          cache-from: type=gha

      - name: pg_dump de la imagen es versión 18
        run: |
          v=$(docker run --rm --entrypoint sh vocero:ci -c '"$PG_BIN/pg_dump" --version')
          echo "$v"
          echo "$v" | grep -q "PostgreSQL) 18\."

      - name: migrar, respaldar y probar la restauración
        run: |
          KEY=$(openssl rand -base64 32)
          mkdir -p "$RUNNER_TEMP/data/media/org_ci"
          echo hola > "$RUNNER_TEMP/data/media/org_ci/archivo.txt"
          app() {
            docker run --rm --network host -v "$RUNNER_TEMP/data:/data" \
              -e DATABASE_URL_MIGRATE="$DB" -e DATABASE_URL="$DB" -e ENCRYPTION_KEY="$KEY" \
              vocero:ci "$@"
          }
          app node migrate.mjs
          # Una organización y un token cifrado con la llave, como los de verdad.
          read -r C I T < <(KEY="$KEY" node -e '
            const c = require("crypto"), k = Buffer.from(process.env.KEY, "base64"), iv = c.randomBytes(12);
            const x = c.createCipheriv("aes-256-gcm", k, iv), e = Buffer.concat([x.update("token-ci"), x.final()]);
            console.log(e.toString("base64"), iv.toString("base64"), x.getAuthTag().toString("base64"))')
          psql "$DB" -v ON_ERROR_STOP=1 \
            -c "insert into organization (id, name, slug, created_at) values ('org_ci', 'CI', 'ci', now())" \
            -c "insert into whatsapp_business_account (id, organization_id, waba_id) values ('wb_ci', 'org_ci', 'w')" \
            -c "insert into meta_credentials (id, organization_id, waba_id, phone_number_id, token_cipher, token_iv, token_tag) values ('mc_ci', 'org_ci', 'w', 'p', '$C', '$I', '$T')"
          app node ops/respaldo.mjs
          # La carpeta es 700 y del usuario de la app: se revisa como root.
          sudo sh -c "cd '$RUNNER_TEMP/data/backups' && ls -l && sha256sum -c ./*.sha256 && tar -tzf ./*-media.tar.gz" | tee revisar.log
          grep -q "media/org_ci/archivo.txt" revisar.log
          app node ops/probar-restauracion.mjs | tee prueba.log
          grep -q "PRUEBA APROBADA" prueba.log
          # La base temporal no se queda.
          test "$(psql "$DB" -Atc "select count(*) from pg_database where datname like 'vocero_prueba_restauracion_%'")" = 0
          # Con otra llave, la prueba FALLA (y lo dice).
          if docker run --rm --network host -v "$RUNNER_TEMP/data:/data" -e DATABASE_URL_MIGRATE="$DB" \
               -e ENCRYPTION_KEY="$(openssl rand -base64 32)" vocero:ci node ops/probar-restauracion.mjs > otra.log; then
            echo "la prueba debió fallar con otra llave"; cat otra.log; exit 1
          fi
          grep -q "NO lo abre" otra.log
