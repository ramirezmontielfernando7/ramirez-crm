<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sin conexión</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #0f172a; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e6edf6; } }
  main { max-width: 22rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; line-height: 1.5; opacity: .8; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 1.5rem; border: 0; border-radius: 10px; background: #12999d; color: #04282a; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>No hay conexión a internet</h1>
  <p>Tus chats y contactos están a salvo. Revisa tu señal o tu Wi-Fi y vuelve a intentarlo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
